function showAirline(id) {
  const al = getFilteredRoutes(id);
  const meta = AIRLINE_META_INFO[id] || {};
  const otherIDs = AIRLINE_IDS.filter(x => x !== id);

  // Fade/scale previous airline out. Removal is delayed briefly so the transition is visible.
  otherIDs.forEach(otherID => {
    Object.values(layers[otherID]).forEach(route => hideRouteWithTransition(route, otherID));
    Object.keys(hubMarkers).forEach(k => {
      if (k.startsWith(`${otherID}_`)) hideHubWithTransition(hubMarkers[k], otherID);
    });
  });

  // Enter from near to far, so the network appears to expand from each route's hub.
  const orderedRoutes = al
    .map(d => {
      const hub = HUB_COORDS[d.origin] || AIRPORT_MASTER[d.origin]?.coords || meta.hubCoords || HUB_COORDS.TPE;
      return { d, distance: haversine(hub, d.coords) };
    })
    .sort((a, b) => a.distance - b.distance);

  orderedRoutes.forEach(({ d }, index) => {
    const route = layers[id][routeKey(d)];
    if (!route) return; // 資料缺漏時安全跳過，避免整個畫面壞掉

    if (!map.hasLayer(route.marker)) route.marker.addTo(map);
    if (!map.hasLayer(route.hit)) route.hit.addTo(map);
    const markerPath = route.marker.getElement && route.marker.getElement();
    if (markerPath) markerPath.classList.remove("airline-marker-exit");
    animateLayerEnter(route.marker, Math.min(index * (isTouchDevice ? 20 : 28), isTouchDevice ? 380 : 520));

    route.hit.off("mouseover").off("mouseout").off("click").off("touchstart").off("touchend").off("pointerdown").off("pointerup").off("tap");
    // Desktop: click handler
    route.hit.on("click", (e) => {
      if (mapWasDragged) { mapWasDragged = false; return; }
      L.DomEvent.stopPropagation(e);
      handleMarkerClick(d, id);
    });
    // iOS/touch: use touchend to avoid preventDefault blocking synthetic click.
    let touchMoved = false;
    route.hit.on("touchstart", (e) => {
      touchMoved = false;
      L.DomEvent.stopPropagation(e);
    });
    route.hit.on("touchmove", () => { touchMoved = true; });
    route.hit.on("touchend", (e) => {
      if (touchMoved || mapWasDragged) { mapWasDragged = false; return; }
      L.DomEvent.stopPropagation(e);
      handleMarkerClick(d, id);
    });
  });

  const hubMarker = hubMarkers[`${id}_${meta.hub}`];
  if (hubMarker && !map.hasLayer(hubMarker)) hubMarker.addTo(map);
  if (id === "BR") {
    const hasTsaRoutes = al.some(d => d.origin === "TSA" || d.origin === "BOTH");
    if (hasTsaRoutes && hubMarkers["BR_TSA"] && !map.hasLayer(hubMarkers["BR_TSA"])) hubMarkers["BR_TSA"].addTo(map);
    const hasKhhRoutes = al.some(d => d.origin === "KHH");
    if (hasKhhRoutes && hubMarkers["BR_KHH"] && !map.hasLayer(hubMarkers["BR_KHH"])) hubMarkers["BR_KHH"].addTo(map);
  }
  if (id === "JX") {
    const hasRmqRoutes = al.some(d => d.origin === "RMQ");
    if (hasRmqRoutes && hubMarkers["JX_RMQ"] && !map.hasLayer(hubMarkers["JX_RMQ"])) hubMarkers["JX_RMQ"].addTo(map);
  }
  if (id === "IT") {
    const hasTnnRoutes = al.some(d => d.origin === "TNN");
    if (hasTnnRoutes && hubMarkers["IT_TNN"] && !map.hasLayer(hubMarkers["IT_TNN"])) hubMarkers["IT_TNN"].addTo(map);
  }
  if (id === "MF") {
    ["FOC","HGH"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`MF_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "MU") {
    ["SHA","NKG","NGB","WUH","TAO","TFU","KMG","XIY","PKX"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`MU_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "KE") {
    ["GMP","CJU","PUS"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`KE_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "GK") {
    ["KIX","NGO","FUK"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`GK_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "NH") {
    ["NRT","KIX"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`NH_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "VN") {
    ["SGN","DAD"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`VN_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }
  if (id === "CI") {
    ["TSA","KHH","RMQ"].forEach(o => {
      const hasRoutes = al.some(d => d.origin === o);
      const marker = hubMarkers[`CI_${o}`];
      if (hasRoutes && marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }

  Object.keys(hubMarkers).forEach(k => {
    if (!k.startsWith(`${id}_`)) return;
    const marker = hubMarkers[k];
    if (map.hasLayer(marker)) {
      const path = marker.getElement && marker.getElement();
      if (path) path.classList.remove("airline-marker-exit");
      animateLayerEnter(marker, 0);
    }
  });
}

function switchAirline(id) {
  // 新增：追蹤切換航空公司標籤事件
  gtag('event', 'switch_airline', {
    'airline_id': id
  });

  if (id === activeAirline) return;
  closeRoutePopup();
  hideInfoCard();
  clearSelectedAirport();
  closeFilterPanel();
  activeAirline = id;
  resetRouteFilters({ skipApply: true });
  showAirline(id);
  updateUI();

  // 航點搜尋固定涵蓋所有航空公司；切換地圖航司時保留查詢與結果。
  const search = document.getElementById("search-input");
  if (search && search.value.trim()) onSearch(search.value);
}

function updateUI() {
  const al = getFilteredRoutes(activeAirline);
  const meta = AIRLINE_META_INFO[activeAirline] || {};

  // 膠囊按鈕 + 展開選單（桌面／手機通用）
  updateAirlinePicker();

  // Stats — 已停飛（SUSPENDED）及尚未開航（SCHEDULED）航線不計入目的地數量，避免誤導
  const activeDestCount = new Set(al.map(d => d.iata)).size;
  document.getElementById("stat-dest").textContent = activeDestCount;

  // Feedback button keeps the neutral header style; only its tooltip follows the active airline
  const fbFab = document.getElementById('fb-fab');
  if (fbFab) fbFab.title = `${t("feedbackReportShort")} · ${airlineCommercialName(activeAirline)}`;
  document.documentElement.style.setProperty('--filter-accent', meta.color || '#5b9bd5');
  updateFilterSummary();

}

// ── 目前選中膠囊 + 展開式選單（桌面版為浮動下拉，手機版為推開版面的內嵌樣式）──────
function updateAirlinePicker() {
  const chip = document.getElementById("airline-chip");
  const chipDot = document.getElementById("airline-chip-dot");
  const chipLabel = document.getElementById("airline-chip-label");
  if (!chip) return;
  const meta = AIRLINE_META_INFO[activeAirline] || {};
  chipDot.style.background = meta.color || "#999";
  chipLabel.textContent = airlineCommercialName(activeAirline);

  const panel = document.getElementById("airline-picker-panel");
  panel.innerHTML = AIRLINE_IDS.map((id, index) => {
    const a = AIRLINE_META_INFO[id] || {};
    const commercialName = airlineCommercialName(id);
    const active = activeAirline === id;
    return `<button type="button" class="picker-option${active ? " active" : ""}" style="--option-index:${index}" onclick="pickAirline('${id}')" role="option" aria-selected="${active}">
      <span class="picker-option-dot" style="background:${a.color || "#999"}"></span>
      <span class="picker-option-label">${commercialName}</span>
      ${active ? '<svg class="picker-option-check" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6L5 8.5L9.5 3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}
    </button>`;
  }).join("");
}
function openAirlinePicker() {
  closeFilterPanel();
  const panel = document.getElementById("airline-picker-panel");
  const isMobile = window.matchMedia("(max-width: 860px), (pointer: coarse)").matches;
  if (isMobile) {
    // #header-left 有 backdrop-filter，會替 position:fixed 建立錯誤的定位基準（不是真正的螢幕視窗），
    // 所以手機版開啟時把面板搬到 <body> 底下，跳脫這個 containing block 問題
    if (panel.parentElement !== document.body) document.body.appendChild(panel);
    const btnRect = document.getElementById("airline-chip").getBoundingClientRect();
    panel.style.top = Math.round(btnRect.bottom + 8) + "px";
  } else {
    const anchor = document.getElementById("airline-picker");
    if (panel.parentElement !== anchor) anchor.appendChild(panel);
    panel.style.top = "";
  }
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  document.getElementById("airline-chip").classList.add("open");
  document.getElementById("airline-chip").setAttribute("aria-expanded", "true");
  syncHeaderOffset();
  if (!headerResizeObserver) window.setTimeout(syncLayoutVars, 420);
}
function closeAirlinePicker() {
  const panel = document.getElementById("airline-picker-panel");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  document.getElementById("airline-chip").classList.remove("open");
  document.getElementById("airline-chip").setAttribute("aria-expanded", "false");
  syncHeaderOffset();
  if (!headerResizeObserver) window.setTimeout(syncLayoutVars, 420);
}
function toggleAirlinePicker() {
  const isOpen = document.getElementById("airline-picker-panel").classList.contains("open");
  if (isOpen) closeAirlinePicker(); else openAirlinePicker();
}
function pickAirline(id) {
  switchAirline(id);
  closeAirlinePicker();
}

function defaultAchievementState() {
  return {
    version: 3,
    visitedAirports: [],
    visitedAirlines: [],
    achievements: Object.fromEntries(ACHIEVEMENT_DEFINITIONS.map(item => [
      item.id, { unlocked: false, unlockedAt: null }
    ]))
  };
}

function normalizeAchievementState(saved) {
  const state = defaultAchievementState();
  if (!saved || typeof saved !== "object") return state;

  // v1 只儲存日本初心者的 airports；升級後沿用既有探索紀錄。
  const legacyAirports = Array.isArray(saved.japanBeginner?.airports)
    ? saved.japanBeginner.airports : [];
  const savedAirports = Array.isArray(saved.visitedAirports) ? saved.visitedAirports : [];
  state.visitedAirports = [...new Set([...legacyAirports, ...savedAirports]
    .map(value => String(value).toUpperCase()))];
  state.visitedAirlines = [...new Set((Array.isArray(saved.visitedAirlines)
    ? saved.visitedAirlines : []).map(value => String(value).toUpperCase()))];

  ACHIEVEMENT_DEFINITIONS.forEach(item => {
    const record = saved.achievements?.[item.id];
    if (record) {
      state.achievements[item.id] = {
        unlocked: Boolean(record.unlocked),
        unlockedAt: record.unlockedAt || null
      };
    }
  });
  if (saved.japanBeginner?.unlocked) {
    state.achievements.japanBeginner = {
      unlocked: true,
      unlockedAt: saved.japanBeginner.unlockedAt || null
    };
  }
  return state;
}

function loadAchievementState() {
  try {
    const raw = localStorage.getItem(ACHIEVEMENT_STORAGE_KEY);
    if (!raw) return defaultAchievementState();
    return normalizeAchievementState(JSON.parse(raw));
  } catch (error) {
    console.warn("Achievement data could not be loaded.", error);
    return defaultAchievementState();
  }
}

function saveAchievementState(state) {
  try {
    localStorage.setItem(ACHIEVEMENT_STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn("Achievement data could not be saved.", error);
  }
  cloudPushAchievementState(state);
}

// ---- Supabase 雲端同步（登入時才會實際寫入） ----
let currentAuthUser = null;

async function cloudPushAchievementState(state) {
  if (!currentAuthUser) return;
  try {
    await supabaseClient.from("achievement_states").upsert({
      user_id: currentAuthUser.id,
      state,
      updated_at: new Date().toISOString()
    });
  } catch (error) {
    console.warn("Cloud sync (push) failed.", error);
  }
}

function mergeAchievementStates(local, cloud) {
  const merged = normalizeAchievementState(local);
  const cloudNorm = normalizeAchievementState(cloud);
  merged.visitedAirports = [...new Set([...merged.visitedAirports, ...cloudNorm.visitedAirports])];
  merged.visitedAirlines = [...new Set([...merged.visitedAirlines, ...cloudNorm.visitedAirlines])];
  ACHIEVEMENT_DEFINITIONS.forEach(item => {
    const a = merged.achievements[item.id];
    const b = cloudNorm.achievements[item.id];
    if (b?.unlocked && !a.unlocked) {
      merged.achievements[item.id] = { unlocked: true, unlockedAt: b.unlockedAt };
    }
  });
  return merged;
}

async function cloudPullAndMerge() {
  if (!currentAuthUser) return;
  try {
    const { data, error } = await supabaseClient
      .from("achievement_states")
      .select("state")
      .eq("user_id", currentAuthUser.id)
      .maybeSingle();
    if (error) throw error;
    const local = loadAchievementState();
    const merged = mergeAchievementStates(local, data?.state || null);
    saveAchievementState(merged);
    const state = reconcileAchievementState(merged);
    refreshAchievementGalleryButton(state);
  } catch (error) {
    console.warn("Cloud sync (pull) failed.", error);
  }
}

function achievementGalleryProgressText(definition, progress) {
  const v = { c: progress.count, t: progress.target, cc: progress.countryCount, ct: progress.countryTarget };
  if (definition.type === "regionGroupAirports") return fmt("achProgCountries", v);
  if (definition.type === "asiaExplorer") return fmt("achProgRegions", v);
  if (definition.type === "airlines") return fmt("achProgAirlines", v);
  return fmt("achProgAirports", v);
}

function achievementGalleryProgressRatio(definition, progress) {
  if (definition.type === "asiaExplorer" || definition.type === "regionGroupAirports") {
    return Math.min(
      progress.count / progress.target,
      progress.countryCount / progress.countryTarget,
      1
    );
  }
  return Math.min(progress.count / progress.target, 1);
}

function formatAchievementDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return new Intl.DateTimeFormat("zh-TW", {
    year: "numeric", month: "short", day: "numeric"
  }).format(date);
}

function reconcileAchievementState(state) {
  let changed = false;
  ACHIEVEMENT_DEFINITIONS.forEach(definition => {
    const record = state.achievements[definition.id];
    if (!record.unlocked && achievementProgress(definition, state).complete) {
      record.unlocked = true;
      record.unlockedAt = new Date().toISOString();
      changed = true;
    }
  });
  if (changed) saveAchievementState(state);
  return state;
}

function refreshAchievementGalleryButton(state = null) {
  const count = document.getElementById("achievement-gallery-button-count");
  if (!count) return;
  const current = state || loadAchievementState();
  const unlocked = ACHIEVEMENT_DEFINITIONS.filter(item => current.achievements[item.id]?.unlocked).length;
  count.textContent = `${unlocked}/${ACHIEVEMENT_DEFINITIONS.length}`;
}

function renderAchievementGallery() {
  const grid = document.getElementById("achievement-gallery-grid");
  const summary = document.getElementById("achievement-gallery-summary");
  if (!grid || !summary) return;
  const state = reconcileAchievementState(loadAchievementState());
  const unlockedCount = ACHIEVEMENT_DEFINITIONS.filter(item => state.achievements[item.id]?.unlocked).length;
  summary.innerHTML = `<strong>${unlockedCount}/${ACHIEVEMENT_DEFINITIONS.length}</strong> ${t("badgeSummary")}`;
  refreshAchievementGalleryButton(state);

  grid.innerHTML = ACHIEVEMENT_DEFINITIONS.map(definition => {
    const record = state.achievements[definition.id];
    const progress = achievementProgress(definition, state);
    const unlocked = Boolean(record.unlocked);
    const concealed = Boolean(definition.hidden && !unlocked);
    const ratio = Math.round(achievementGalleryProgressRatio(definition, progress) * 100);
    const date = formatAchievementDate(record.unlockedAt);
    const badgeMarkup = concealed
      ? `<span class="achievement-gallery-image-fallback" aria-hidden="true">?</span>`
      : `<img src="${definition.badge}" alt="${fmt("badgeAlt", { title: achTitle(definition) })}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <span class="achievement-gallery-image-fallback" aria-hidden="true">${definition.code}</span>`;
    const status = concealed ? t("achStatusSecret") : (unlocked ? t("unlocked") : t("achStatusProgress"));
    const difficulty = definition.difficulty ? ` · ${achDifficulty(definition)}` : "";
    const progressText = concealed ? t("hiddenNotRevealed") : achievementGalleryProgressText(definition, progress);
    return `<article class="achievement-gallery-card ${unlocked ? "unlocked" : "locked"} ${concealed ? "secret" : ""}">
      <div class="achievement-gallery-badge">
        ${badgeMarkup}
      </div>

      <h3>${concealed ? "？？？" : achTitle(definition)}</h3>
      <p class="achievement-gallery-description">${concealed ? (LANG === "en" ? (definition.hiddenHintEn || definition.hiddenHint) : definition.hiddenHint) : achievementDescription(definition)}</p>

window.addEventListener("keydown", event => {
  if (document.getElementById("add-flight-sheet")?.classList.contains("show")) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeAddFlightSheet();
    }
    return;
  }
  const overlay = document.getElementById("achievement-gallery-overlay");
  if (!overlay?.classList.contains("show")) return;
  if (document.getElementById("auth-overlay")?.classList.contains("show")) {
    if (event.key === "Escape") {
      event.preventDefault();
      authClose();
    }
    return;
  }

  if (event.key === "Escape") {
    event.preventDefault();
    closeAchievementGallery();
    return;
  }

  if (event.key !== "Tab") return;
  const focusable = [...overlay.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )].filter(element => !element.hidden && element.getAttribute("aria-hidden") !== "true" && element.offsetParent !== null);
  if (!focusable.length) return;

  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  const active = document.activeElement;
  if (!overlay.contains(active)) {
    event.preventDefault();
    (event.shiftKey ? last : first).focus();
  } else if (event.shiftKey && active === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  }
});

function rareAirportCodes(maxAirlines) {
  const airlineSets = new Map();
  AIRLINE_IDS.forEach(id => {
    (AIRLINES[id] || []).forEach(route => {
      if (!route.iata) return;
      const iata = String(route.iata).toUpperCase();
      if (!airlineSets.has(iata)) airlineSets.set(iata, new Set());
      airlineSets.get(iata).add(id);
    });
  });
  return new Set([...airlineSets.entries()]
    .filter(([, airlines]) => airlines.size <= maxAirlines)
    .map(([iata]) => iata));
}

function achievementProgress(definition, state) {
  const airports = state.visitedAirports;
  if (definition.type === "regionAirports") {
    const count = airports.filter(iata => AIRPORT_MASTER[iata]?.region === definition.region).length;
    return { complete: count >= definition.target, count, target: definition.target };
  }
  if (definition.type === "regionGroupAirports") {
    const regions = new Set(definition.regions || []);
    const matchingAirports = airports.filter(iata => regions.has(AIRPORT_MASTER[iata]?.region));
    const countries = new Set(matchingAirports
      .map(iata => AIRPORT_MASTER[iata]?.country)
      .filter(Boolean));
    return {
      complete: matchingAirports.length >= definition.target && countries.size >= definition.countryTarget,
      count: matchingAirports.length,
      target: definition.target,
      countryCount: countries.size,
      countryTarget: definition.countryTarget
    };
  }
  if (definition.type === "airlines") {
    const count = state.visitedAirlines.length;
    return { complete: count >= definition.target, count, target: definition.target };
  }
  if (definition.type === "asiaExplorer") {
    const asiaAirports = airports.filter(iata => ASIA_ACHIEVEMENT_REGIONS.has(AIRPORT_MASTER[iata]?.region));
    const countries = new Set(asiaAirports.map(iata => AIRPORT_MASTER[iata]?.country).filter(Boolean));
    return {
      complete: asiaAirports.length >= definition.airportTarget && countries.size >= definition.countryTarget,
      count: asiaAirports.length,
      target: definition.airportTarget,
      countryCount: countries.size,
      countryTarget: definition.countryTarget
    };
  }
  if (definition.type === "rareAirports") {
    const rare = rareAirportCodes(definition.maxAirlines);
    const count = airports.filter(iata => rare.has(iata)).length;
    return { complete: count >= definition.target, count, target: definition.target };
  }
  if (definition.type === "requiredAirports") {
    const required = definition.airports || [];
    const count = required.filter(iata => airports.includes(iata)).length;
    return { complete: count >= required.length, count, target: required.length };
  }
  return { complete: false, count: 0, target: 1 };
}

function achievementDetail(definition, progress, justUnlocked) {
  if (justUnlocked) return fmt("achDetailUnlocked", { title: achTitle(definition) });
  const v = { c: progress.count, t: progress.target, cc: progress.countryCount, ct: progress.countryTarget };
  if (definition.type === "regionGroupAirports") return fmt("achDetailNea", v);
  if (definition.type === "asiaExplorer") return fmt("achDetailAsia", v);
  return fmt(definition.type === "airlines" ? "achDetailAirlines" : "achDetailAirports", v);
}

function setAchievementBadge(definition) {
  const seal = document.getElementById("achievement-seal");

function launchAchievementConfetti() {
  if (prefersReducedMotion) return;
  document.getElementById("achievement-confetti")?.remove();

  const colors = ["#F6C84A", "#F5F5F7", "#9CA3AF"];
  const container = document.createElement("div");
  container.id = "achievement-confetti";
  container.setAttribute("aria-hidden", "true");

  for (let index = 0; index < 28; index += 1) {
    const piece = document.createElement("span");
    piece.className = "achievement-confetti-piece";
    piece.style.setProperty("--x", `${Math.random() * 100}vw`);
    piece.style.setProperty("--drift", `${Math.random() * 24 - 12}vw`);
    piece.style.setProperty("--size", `${6 + Math.random() * 6}px`);
    piece.style.setProperty("--color", colors[index % colors.length]);
    piece.style.setProperty("--delay", `${Math.random() * .45}s`);
    piece.style.setProperty("--duration", `${1.4 + Math.random() * .8}s`);
    piece.style.setProperty("--spin", `${360 + Math.random() * 900}deg`);
    container.appendChild(piece);
  }

  document.body.appendChild(container);
  window.setTimeout(() => container.remove(), 2800);
}

function showNextAchievementToast() {

  if (!toast) return;
  achievementToastVisible = true;
  setAchievementBadge(definition);
  document.getElementById("achievement-count").textContent = `${Math.min(progress.count, progress.target)}/${progress.target}`;
  document.getElementById("achievement-kicker").textContent = justUnlocked ? "Achievement unlocked" : "Challenge progress";
  document.getElementById("achievement-title").textContent = achTitle(definition);
  document.getElementById("achievement-detail").textContent = achievementDetail(definition, progress, justUnlocked);
  toast.classList.toggle("unlocked", justUnlocked);
  toast.classList.add("show");
  toast.setAttribute("aria-hidden", "false");
  if (justUnlocked) launchAchievementConfetti();
  if (achievementToastTimer) window.clearTimeout(achievementToastTimer);
  achievementToastTimer = window.setTimeout(closeAchievementToast, justUnlocked ? 6500 : 3000);

function queueAchievementToast(definition, progress, justUnlocked = false) {
  achievementToastQueue.push({ definition, progress, justUnlocked });
  showNextAchievementToast();
}

function trackAirportAchievements(d, airlineId) {
  if (!d?.iata) return;
  const state = loadAchievementState();
  const iata = String(d.iata).toUpperCase();
  const id = String(airlineId || d.airline || "").toUpperCase();
  const isNewAirport = !state.visitedAirports.includes(iata);
  const isNewAirline = id && !state.visitedAirlines.includes(id);
  if (!isNewAirport && !isNewAirline) return;

  // 同一機場由不同航空公司或出發地進入時，只計算一次。
  if (isNewAirport) state.visitedAirports.push(iata);
  if (isNewAirline) state.visitedAirlines.push(id);

  const newlyUnlocked = [];
  ACHIEVEMENT_DEFINITIONS.forEach(definition => {
    const progress = achievementProgress(definition, state);
    const record = state.achievements[definition.id];
    if (progress.complete && !record.unlocked) {
      record.unlocked = true;
      record.unlockedAt = new Date().toISOString();
      newlyUnlocked.push({ definition, progress });
    }
  });
  saveAchievementState(state);
  refreshAchievementGalleryButton(state);

  if (newlyUnlocked.length) {
    newlyUnlocked.forEach(item => queueAchievementToast(item.definition, item.progress, true));
  }
}

  return key === "SCHEDULED" && d.effectiveDate ? `${label} · ${d.effectiveDate}` : label;
}

function getGlobalSearchHits(value) {
  const q = value.trim().toLowerCase();
  if (!q) return [];
  const rows = [];
  // 搜尋範圍刻意不使用 activeAirline 或 routeFilters，確保永遠查詢全部航司。
  AIRLINE_IDS.forEach(id => {
    (AIRLINES[id] || []).forEach(d => {
      const iata = String(d.iata || "").toLowerCase();
      const city = String(d.city || "").toLowerCase();
      const airportName = String(d.airportName || "").toLowerCase();
      const iataHit = iata.includes(q);
      const cityHit = city.includes(q);
      const airportNameHit = airportName.includes(q);
      if (iataHit || cityHit || airportNameHit) {
        // tier 0: 命中 IATA 或城市名；tier 1: 只命中機場全名（排到最後）
        const tier = (iataHit || cityHit) ? 0 : 1;
        rows.push({ id, d, exact: iata === q ? 0 : 1, tier });
      }
    });
  });
  return rows.sort((a, b) =>
    a.tier - b.tier ||
    a.exact - b.exact ||
    a.d.iata.localeCompare(b.d.iata) ||
    AIRLINE_IDS.indexOf(a.id) - AIRLINE_IDS.indexOf(b.id) ||
    String(a.d.origin || "").localeCompare(String(b.d.origin || ""))
  );
}

function haversineKm(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]);
  const dLng = toRad(b[1] - a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h)));
}

function renderFlightLogRecords(rows) {
  const el = document.getElementById('flight-log-records');
  if (!el) return;
  if (!rows.length) { el.innerHTML = ''; return; }

  const longest = rows.reduce((max, r) => (r.distance_km || 0) > (max?.distance_km || 0) ? r : max, null);

  const airlineCounts = {};
  rows.forEach(r => { if (r.airline_id) airlineCounts[r.airline_id] = (airlineCounts[r.airline_id] || 0) + 1; });
  const topAirlineId = Object.keys(airlineCounts).sort((a, b) => airlineCounts[b] - airlineCounts[a])[0];

  const arrCounts = {};
  rows.forEach(r => { if (r.arr_iata) arrCounts[r.arr_iata] = (arrCounts[r.arr_iata] || 0) + 1; });
  const depCounts = {};
  rows.forEach(r => { if (r.dep_iata) depCounts[r.dep_iata] = (depCounts[r.dep_iata] || 0) + 1; });
  const homeIata = Object.keys(depCounts).sort((a, b) => depCounts[b] - depCounts[a])[0];   // most common departure = home base
  const topArr = Object.keys(arrCounts).filter(k => k !== homeIata).sort((a, b) => arrCounts[b] - arrCounts[a])[0];

  const totalDistance = rows.reduce((sum, r) => sum + (r.distance_km || 0), 0);
  const totalMinutes = rows.reduce((sum, r) => sum + (r.distance_km ? estimateFlightMinutes(r.distance_km) : 0), 0);
  const uniqueAirports = new Set();
  rows.forEach(r => { if (r.dep_iata) uniqueAirports.add(r.dep_iata); if (r.arr_iata) uniqueAirports.add(r.arr_iata); });
  const countries = new Set();
  rows.forEach(r => {
    const c1 = window.AIRPORT_MASTER?.[r.dep_iata]?.country;
    const c2 = window.AIRPORT_MASTER?.[r.arr_iata]?.country;
    if (c1) countries.add(c1);
    if (c2) countries.add(c2);
  });
  const EARTH_CIRCUMFERENCE_KM = 40075;
  const MOON_DISTANCE_KM = 384400;

  const cards = [
    {
      label: t('statLongest'),
      value: longest ? `${longest.dep_iata} → ${longest.arr_iata}` : '—',
      sub: longest?.distance_km ? `${longest.distance_km.toLocaleString()} km` : '',
    },
    {
      label: t('statTopAirline'),
      value: topAirlineId ? (window.AIRLINE_META?.[topAirlineId]?.commercialName || topAirlineId) : '—',
      sub: topAirlineId ? fmt('tripsN', { n: airlineCounts[topAirlineId] }) : '',
    },
    {
      label: t('statTopDest'),
      value: topArr || '—',
      sub: topArr ? fmt('tripsN', { n: arrCounts[topArr] }) : '',
    },
    {
      label: t('statTotalDist'),
      value: totalDistance ? `${Math.round(totalDistance).toLocaleString()} km` : '—',
      sub: '',
    },
    {
      label: t('statTotalFlights'),
      value: rows.length ? `${rows.length}` : '—',
      sub: rows.length ? t('legsUnit') : '',
    },
    {
      label: t('statAirports'),
      value: uniqueAirports.size ? `${uniqueAirports.size}` : '—',
      sub: uniqueAirports.size ? t('uniqueAirportsUnit') : '',
    },
    {
      label: t('statCountries'),
      value: countries.size ? `${countries.size}` : '—',
      sub: '',
    },
    {
      label: t('statTotalTime'),
      value: totalMinutes ? formatFlightMinutes(totalMinutes) : '—',
      sub: '',
    },
    {
      label: t('statEarthLaps'),
      value: totalDistance ? fmt('lapsN', { n: (totalDistance / EARTH_CIRCUMFERENCE_KM).toFixed(2) }) : '—',
      sub: '',
    },
    {
      label: t('statMoon'),
      value: totalDistance ? `${Math.min(100, totalDistance / MOON_DISTANCE_KM * 100).toFixed(2)}%` : '—',
      sub: '',
    },
  ];
  el.innerHTML = cards.map(c => `
    <div class="flight-log-record-card">
      <div class="rlabel">${c.label}</div>
      <div class="rvalue">${c.value}</div>
      ${c.sub ? `<div class="rsub">${c.sub}</div>` : ''}
    </div>
  `).join('');
}

function renderFlightLogPanel() {
  const years = flightLogYears();
  if (flightLogYearFilter !== 'all' && !years.includes(flightLogYearFilter)) flightLogYearFilter = 'all';
  const yearFilterEl = document.getElementById('flight-log-year-filter');
  if (yearFilterEl) {
    if (flightLogRouteFilter) {
      yearFilterEl.innerHTML = `
        <button type="button" class="flight-log-year-chip active" onclick="clearFlightLogRouteFilter()">
          ✕ ${flightLogRouteFilter.dep}⇄${flightLogRouteFilter.arr} ${t('routeFilterActive')}
        </button>
      `;
    } else {
      yearFilterEl.innerHTML = ['all', ...years].map(y => `
        <button type="button" class="flight-log-year-chip${flightLogYearFilter === y ? ' active' : ''}" onclick="setFlightLogYearFilter('${y}')">${y === 'all' ? t('filterAll') : fmt('yearN', { y })}</button>
      `).join('');
    }
  }

  const rows = flightLogRouteFilter
    ? flightLogsCache.filter(r =>
        (r.dep_iata === flightLogRouteFilter.dep && r.arr_iata === flightLogRouteFilter.arr) ||
        (r.dep_iata === flightLogRouteFilter.arr && r.arr_iata === flightLogRouteFilter.dep))
    : (flightLogYearFilter === 'all'
        ? flightLogsCache
        : flightLogsCache.filter(r => (r.flight_date || '').slice(0, 4) === flightLogYearFilter));

  const rendered = new Set();
  const trips = []; // 先把 rows 配對成「行程」清單（多段/去回程合併、單程各自一筆），共用於統計與渲染
  flightLogCardLegMap = {};

  // Pass 1：依 trip_id 分組，支援 2 段以上的多城市行程
  const tripGroups = new Map();
  rows.forEach(r => {
    if (!r.trip_id) return;
    if (!tripGroups.has(r.trip_id)) tripGroups.set(r.trip_id, []);
    tripGroups.get(r.trip_id).push(r);
  });
  tripGroups.forEach(groupRows => {
    if (groupRows.length < 2) return; // 孤兒 trip_id（例如另一段被刪了）落回單程處理
    groupRows.forEach(r => rendered.add(r.id));
    const legs = groupRows.slice().sort((a, b) =>
      a.flight_date !== b.flight_date ? a.flight_date.localeCompare(b.flight_date) : (a.created_at || '').localeCompare(b.created_at || ''));
    const crossYear = legs[0].flight_date.slice(0, 4) !== legs[legs.length - 1].flight_date.slice(0, 4);
    trips.push({ anchorDate: legs[0].flight_date, legs, crossYear });
  });

  // Pass 2：剩下的沿用原本去回程配對（paired_log_id）或單程
  rows.forEach(r => {
    if (rendered.has(r.id)) return;
    rendered.add(r.id);
    const pair = r.paired_log_id ? flightLogsCache.find(x => x.id === r.paired_log_id) : null;
    if (pair && !rendered.has(pair.id)) {
      rendered.add(pair.id);
      // 判斷去程/回程：先比日期，日期相同（同天來回）時改比 created_at（先建立的一筆＝去程），
      // 避免日期打平時陣列順序（依 created_at desc 抓資料）把回程誤判成去程。
      const rIsEarlier = r.flight_date !== pair.flight_date
        ? r.flight_date < pair.flight_date
        : r.created_at <= pair.created_at;
      const [outbound, inbound] = rIsEarlier ? [r, pair] : [pair, r];
      // 去回程跨年時（例如去程 2023/12/30、回程 2024/1/5），篩選其中一個年份仍會完整顯示這趟行程，
      // 用 crossYear 標記讓卡片加註提示，避免使用者誤以為篩選功能出錯。
      const crossYear = outbound.flight_date.slice(0, 4) !== inbound.flight_date.slice(0, 4);
      trips.push({ anchorDate: outbound.flight_date, legs: [outbound, inbound], crossYear });
    } else {
      trips.push({ anchorDate: r.flight_date, legs: [r], crossYear: false });
    }
  });
  trips.forEach(t => { flightLogCardLegMap[t.legs[0].id] = t.legs.map(l => l.id); });
  trips.sort((a, b) => b.anchorDate.localeCompare(a.anchorDate));
  {   // upcoming trips first (nearest first) so pagination never hides the next flight
    const today = todayISO();
    const upcoming = trips.filter(tr => tr.anchorDate > today).sort((a, b) => a.anchorDate.localeCompare(b.anchorDate));
    const past = trips.filter(tr => tr.anchorDate <= today);
    trips.length = 0; trips.push(...upcoming, ...past);
  }

  const today = todayISO();
  const flownRows = rows.filter(r => (r.flight_date || '') <= today);      // stats count flights that already happened
  const flownTrips = trips.filter(tr => tr.anchorDate <= today);
  const totalKm = flownRows.reduce((sum, r) => sum + (r.distance_km || 0), 0);
  const countries = new Set();
  rows.forEach(r => {
    const c1 = window.AIRPORT_MASTER?.[r.dep_iata]?.country;
    const c2 = window.AIRPORT_MASTER?.[r.arr_iata]?.country;
    if (c1) countries.add(c1);
    if (c2) countries.add(c2);
  });
  const totalDays = flownTrips.reduce((sum, t) => {
    if (t.legs.length === 1) return sum + 1;
    const span = Math.round((new Date(t.legs[t.legs.length - 1].flight_date) - new Date(t.legs[0].flight_date)) / 86400000) + 1;
    return sum + Math.max(span, 1);
  }, 0);
  document.getElementById('fl-stat-km').textContent = totalKm.toLocaleString();
  document.getElementById('fl-stat-days').textContent = totalDays;

  renderFlightLogRecords(flownRows);

  const listEl = document.getElementById('flight-log-list');
  const emptyEl = document.getElementById('flight-log-empty');
  const moreBtn = document.getElementById('flight-log-more-btn');
  if (!rows.length) {
    listEl.innerHTML = '';
    if (moreBtn) moreBtn.style.display = 'none';
    emptyEl.style.display = 'block';
    emptyEl.textContent = flightLogsCache.length
      ? t('flightLogEmptyYear')
      : t('flightLogEmptyAll');
    return;
  }
  emptyEl.style.display = 'none';

  const groups = [];
  trips.forEach(t => {
    const last = groups[groups.length - 1];
    if (last && last.date === t.anchorDate) last.trips.push(t);
    else groups.push({ date: t.anchorDate, trips: [t] });
  });

  const visibleGroups = groups.slice(0, flightLogVisibleGroups);
  listEl.classList.toggle('select-mode', flightLogSelectMode);
  renderJourneyList(listEl, visibleGroups.flatMap(g => g.trips));
  if (moreBtn) moreBtn.style.display = groups.length > visibleGroups.length ? 'block' : 'none';
}

// One component for both variants ("recent" | "upcoming"); the variant only changes the visual.
const JOURNEY_RIDGES = [
  ['M0 118L28 92L46 104L78 66L104 96L128 78L158 108L200 84V160H0Z', 'M0 138L34 118L62 132L96 108L132 130L166 114L200 128V160H0Z'],
  ['M0 122C30 100 56 104 84 118S140 132 170 108S200 100 200 100V160H0Z', 'M0 140C40 126 70 146 110 136S170 122 200 134V160H0Z'],
  ['M0 126L40 100L70 118L112 58L140 96L162 84L200 120V160H0Z', 'M0 144L44 126L90 142L140 122L200 140V160H0Z']
];
function journeyVisualURI(destination, variant) {
  const ink = '156,163,175';
  let body;
  if (variant === 'upcoming') {
    body = `<path d="M-10 132C50 40 130 26 210 62" fill="none" stroke="rgba(${ink},.32)" stroke-width="1.2" stroke-dasharray="3 6" stroke-linecap="round"/>`;
  } else {
    const seed = [...String(destination || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % JOURNEY_RIDGES.length;
    const [back, front] = JOURNEY_RIDGES[seed];
    body = `<path d="${back}" fill="rgba(${ink},.09)"/><path d="${front}" fill="rgba(${ink},.15)"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMax slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${ink})" stop-opacity=".08"/><stop offset=".75" stop-color="rgb(${ink})" stop-opacity="0"/></linearGradient></defs><rect width="200" height="160" fill="url(#g)"/>${body}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

// Background photos live in assets/backgrounds/. One is picked per destination (stable), and
// if a file is missing the card silently keeps the built-in landscape above.
const JOURNEY_PHOTOS = [1, 2, 3, 4].map(n => `assets/backgrounds/skydex_asset_bg_${n}.png`);
const journeyPhotoState = {};
function journeyPhotoFor(destination) {
  const seed = [...String(destination || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
  return JOURNEY_PHOTOS[seed % JOURNEY_PHOTOS.length];
}
function applyJourneyPhoto(visual, url) {
  const show = () => {
    visual.style.backgroundImage = `url("${String(url).replace(/"/g, '%22')}")`;
    visual.classList.add('journey-card__visual--photo');
  };
  if (journeyPhotoState[url] === 'ok') { show(); return; }
  if (journeyPhotoState[url] === 'fail') return;
  const img = new Image();
  img.onload = () => { journeyPhotoState[url] = 'ok'; show(); };
  img.onerror = () => { journeyPhotoState[url] = 'fail'; };
  img.src = url;
}

/**
 * createJourneyCard({ origin, destination, originCity, destinationCity, date, variant, image, onClick })
 * origin / destination : IATA codes            originCity / destinationCity : city names
 * date                 : preformatted string   variant : "recent" (default) | "upcoming"
 * image                : optional URL (rendered faintly on the right); falls back to a quiet landscape / flight-path
 * onClick              : () => void            the whole card is the tap target
 */
function createJourneyCard({ origin, destination, originCity, destinationCity, date, variant = 'recent', image, onClick }) {
  const el = document.createElement('div');
  el.className = `journey-card journey-card--${variant}`;
  el.setAttribute('role', 'button');
  el.tabIndex = 0;
  el.setAttribute('aria-label', `${origin} → ${destination}, ${originCity} → ${destinationCity}, ${date}`);
  el.innerHTML = `
    <div class="journey-card__visual" aria-hidden="true"></div>
    <div class="journey-card__body">
      <div class="journey-card__route">
        <span class="jc-code">${escHtml(origin)}</span><span class="jc-arrow" aria-hidden="true">→</span><span class="jc-code">${escHtml(destination)}</span>
        <span class="jc-city">${escHtml(originCity)}</span><span></span><span class="jc-city">${escHtml(destinationCity)}</span>
      </div>
      <div class="journey-card__foot">
        <span class="jc-date">${escHtml(date)}</span>
        <svg class="jc-plane" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12c0 .8-.6 1.3-1.4 1.3H15.6l-3.7 7.2H9.6l1.9-7.2H6.2L4.4 15.6H2.6L3.8 12 2.6 8.4h1.8l1.8 2.3h5.3L9.6 3.5h2.3l3.7 7.2h5c.8 0 1.4.5 1.4 1.3z"/></svg>
      </div>
    </div>`;
  const visual = el.querySelector('.journey-card__visual');
  visual.style.backgroundImage = journeyVisualURI(destination, variant);   // quiet built-in fallback
  const photo = image || (variant === 'recent' ? journeyPhotoFor(destination) : null);   // upcoming cards stay photo-free

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(e); }

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderJourneyList(listEl, trips) {
  const today = todayISO();
  const upcoming = trips.filter(tr => tr.anchorDate > today).sort((a, b) => a.anchorDate.localeCompare(b.anchorDate));
  const past = trips.filter(tr => tr.anchorDate <= today);
  const nodes = [];
  let lastLabel = null;
  [...upcoming, ...past].forEach(trip => {
    const isUpcoming = trip.anchorDate > today;
    const label = isUpcoming ? t('journeyUpcoming') : trip.anchorDate.slice(0, 4);
    if (label !== lastLabel) {
      const h = document.createElement('div');
      h.className = 'journey-section-label';
      h.textContent = label;
      nodes.push(h);
      lastLabel = label;
    }
    nodes.push(renderTripEntry(trip.legs, trip.crossYear, isUpcoming));
  });
  listEl.replaceChildren(...nodes);
}

function shortDate(dateStr) {
  return dateStr ? dateStr.slice(5).replace('-', '/') : '';
}

function cityOf(iata) {
  return cityName(iata, window.AIRPORT_MASTER?.[iata]?.city) || iata;
}

function renderTripEntry(legs, crossYear, isUpcoming) {
  const isMultiLeg = legs.length > 1;
  const isSimpleRoundTrip = legs.length === 2 && legs[0].dep_iata === legs[1].arr_iata && legs[0].arr_iata === legs[1].dep_iata;
  const first = legs[0];
  const last = legs[legs.length - 1];
  const tripDays = isMultiLeg
    ? Math.max(Math.round((new Date(last.flight_date) - new Date(first.flight_date)) / 86400000) + 1, 1)
    : null;
  const dateText = isMultiLeg ? `${shortDate(first.flight_date)} — ${shortDate(last.flight_date)}` : shortDate(first.flight_date);

  const legLabels = isSimpleRoundTrip ? [t("legOutbound"), t("legInbound")] : (isMultiLeg ? legs.map((_, i) => t("legN").replace("{n}", i + 1)) : [t("legOneWay")]);
  const legRowsHtml = legs.map((r, i) => {
    const meta = window.AIRLINE_META?.[r.airline_id];
    const airlineName = meta?.commercialName || meta?.fullName || meta?.shortName || '';
    return `
    <div class="ticket-leg-block">
      <div class="ticket-leg-row">
        <span class="ticket-leg-label">${legLabels[i]}</span>
        <span class="ticket-leg-date">${shortDate(r.flight_date)}</span>
        <span class="ticket-leg-route">${r.dep_iata} → ${r.arr_iata}</span>
        <span class="ticket-leg-km">${r.distance_km ? r.distance_km.toLocaleString() + ' km' : ''}</span>
      </div>
      ${(airlineName || r.flight_no) ? `<div class="ticket-leg-airline">${[airlineName, r.flight_no ? escHtml(r.flight_no) : ''].filter(Boolean).join(' · ')}</div>` : ''}
    </div>`;
  }).join('');
  const noteHtml = legs.some(r => r.note)
    ? `<div class="ticket-note">${legs.map(r => r.note).filter(Boolean).map(escHtml).join(' / ')}</div>`
    : '';

  const badgeLabel = isSimpleRoundTrip ? t("tripRoundTrip") : (isMultiLeg ? t("tripMultiCity") : t("legOneWay"));
  const metaLine = (isMultiLeg || crossYear) ? [badgeLabel, tripDays ? fmt("tripDaysN", { n: tripDays }) : '', crossYear ? t("crossYearBadge") : ''].filter(Boolean).join(' · ') : '';
  const cardKey = first.id;
  const isSelected = flightLogSelectMode && flightLogSelectedKeys.has(cardKey);

  const entry = document.createElement('article');
  entry.className = `trip-entry${isSelected ? ' selected' : ''}`;
  entry.dataset.cardKey = cardKey;
  entry.innerHTML = `
    <div class="trip-row">
      <div class="ticket-checkbox" onclick="toggleCardSelection(event, '${cardKey}')" aria-label="${t("selectCard")}"></div>
      <div class="trip-card-slot"></div>
    </div>
    <div class="trip-details" inert>
      <div class="trip-details-clip"><div class="trip-details-body">
        ${metaLine ? `<div class="trip-meta">${metaLine}</div>` : ''}
        ${legRowsHtml}
        ${noteHtml}
        <button class="trip-edit-btn" type="button" onclick="editFlightLog('${first.id}')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.5 2.5l2 2-7.5 7.5-2.6.6.6-2.6 7.5-7.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          ${t('editRecord')}
        </button>
      </div></div>
    </div>`;
  const details = entry.querySelector('.trip-details');
  const card = createJourneyCard({
    origin: first.dep_iata,
    destination: first.arr_iata,
    originCity: cityOf(first.dep_iata),
    destinationCity: cityOf(first.arr_iata),
    date: dateText,
    variant: isUpcoming ? 'upcoming' : 'recent',
    onClick: (e) => {
      if (flightLogSelectMode) { toggleCardSelection(e, cardKey); return; }
      const open = entry.classList.toggle('open');
      card.setAttribute('aria-expanded', String(open));
      details.inert = !open;
    }
  });
  if (!flightLogSelectMode) card.setAttribute('aria-expanded', 'false');
  entry.querySelector('.trip-card-slot').replaceWith(card);
  return entry;
}

async function mergeSelectedFlightLogs() {
  const keys = [...flightLogSelectedKeys];
  if (keys.length < 2) return;
  const allIds = keys.flatMap(k => flightLogCardLegMap[k] || [k]);
  const rows = allIds.map(id => flightLogsCache.find(r => r.id === id)).filter(Boolean);
  const existingTripId = rows.find(r => r.trip_id)?.trip_id;
  const tripId = existingTripId || (window.crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
  try {
    const { error } = await supabaseClient.from('flight_logs').update({ trip_id: tripId }).in('id', allIds);
    if (error) throw error;
    flightLogsCache = await fetchFlightLogs();
    toggleFlightLogSelectMode(); // 合併完自動退出選取模式並重繪
  } catch (error) {
    console.warn('Merge flight logs failed.', error);
  }
}


async function maybePairFlightLog(newRow) {
  if (!newRow) return;
  const candidate = flightLogsCache.find(r =>
    r.id !== newRow.id &&
    !r.paired_log_id &&
    r.dep_iata === newRow.arr_iata &&
    r.arr_iata === newRow.dep_iata &&
    Math.abs(new Date(r.flight_date) - new Date(newRow.flight_date)) <= 30 * 86400000
  );
  if (!candidate) return;
  const ok = window.confirm(fmt('mergeConfirm', { dep: candidate.dep_iata, arr: candidate.arr_iata, date: candidate.flight_date }));
  if (!ok) return;
  try {
    const { error } = await supabaseClient.from('flight_logs')
      .update({ paired_log_id: candidate.id })
      .eq('id', newRow.id);
    if (error) throw error;
    const { error: error2 } = await supabaseClient.from('flight_logs')
      .update({ paired_log_id: newRow.id })
      .eq('id', candidate.id);
    if (error2) throw error2;
    flightLogsCache = await fetchFlightLogs();
    renderFlightLogPanel();
  } catch (error) {
    console.warn('Pair flight log failed.', error);
  }
}

let myFlightsLayer = null;
let myFlightsVisible = false;

function resetMyFlightsMapButton() {
  const btn = document.getElementById('flight-log-map-toggle');
  const label = document.getElementById('flight-log-map-toggle-label');
  btn?.classList.remove('active');
  if (label) label.textContent = t('showOnMap');
}

function buildMyFlightsLayer(rows) {
  const segments = new Map();
  rows.forEach(r => {
    if (!r.dep_iata || !r.arr_iata) return;
    const key = [r.dep_iata, r.arr_iata].sort().join('-');
    if (!segments.has(key)) segments.set(key, { dep: r.dep_iata, arr: r.arr_iata, count: 0, airlineCounts: {} });
    const seg = segments.get(key);
    seg.count += 1;
    if (r.airline_id) seg.airlineCounts[r.airline_id] = (seg.airlineCounts[r.airline_id] || 0) + 1;
  });

  const layerItems = [];
  const visitedAirports = new Set();
  segments.forEach(seg => {
    const depAirport = window.AIRPORT_MASTER?.[seg.dep];
    const arrAirport = window.AIRPORT_MASTER?.[seg.arr];
    if (!depAirport?.coords || !arrAirport?.coords) return;
    visitedAirports.add(seg.dep);
    visitedAirports.add(seg.arr);
    const s = mapCoord(depAirport.coords, seg.dep);
    const e = mapCoord(arrAirport.coords, seg.arr);
    const topAirlineId = Object.keys(seg.airlineCounts).sort((a, b) => seg.airlineCounts[b] - seg.airlineCounts[a])[0];
    const routeColor = (topAirlineId && AIRLINE_META_INFO[topAirlineId]?.color) || '#f0c252';
    layerItems.push(L.polyline(bezierArc(s, e), {
      color: routeColor,
      weight: Math.min(1.6 + seg.count * 0.6, 5),
      opacity: 0.82,
      interactive: true,
    }).bindTooltip(`${seg.dep} ⇄ ${seg.arr}　${fmt('flownTimes', { n: seg.count })}`, { sticky: true })
      .on('click', () => openFlightLogPanelForRoute(seg.dep, seg.arr)));
  });

  visitedAirports.forEach(iata => {
    const airport = window.AIRPORT_MASTER?.[iata];
    if (!airport?.coords) return;
    const c = mapCoord(airport.coords, iata);
    layerItems.push(L.circleMarker(c, {
      radius: 4.5,
      color: '#1a1206',
      weight: 1.5,
      fillColor: '#1a1206',
      fillOpacity: 0.9,
      interactive: false,
    }));
  });

  return { layerItems, bounds: layerItems.length ? L.featureGroup(layerItems).getBounds() : null };
}

async function toggleMyFlightsOnMap() {
  if (!currentAuthUser) { authFabClick(); return; }
  const btn = document.getElementById('flight-log-map-toggle');
  const label = document.getElementById('flight-log-map-toggle-label');

  if (myFlightsVisible) {
    if (myFlightsLayer) { map.removeLayer(myFlightsLayer); myFlightsLayer = null; }
    myFlightsVisible = false;
    resetMyFlightsMapButton();
    showAirline(activeAirline);
    return;
  }

  if (btn) { btn.disabled = true; }
  if (label) { label.textContent = t('mapLoading'); }
  flightLogsCache = await fetchFlightLogs();
  if (btn) { btn.disabled = false; }

  if (!flightLogsCache.length) {
    if (label) { label.textContent = t('mapNoLogs'); }
    window.setTimeout(resetMyFlightsMapButton, 1800);
    return;
  }

  const { layerItems, bounds } = buildMyFlightsLayer(flightLogsCache);
  if (!layerItems.length) {
    if (label) { label.textContent = t('mapNoLocatable'); }
    window.setTimeout(resetMyFlightsMapButton, 1800);
    return;
  }
  hideActiveAirlineLayers();
  myFlightsLayer = L.layerGroup(layerItems).addTo(map);
  myFlightsVisible = true;
  btn?.classList.add('active');
  if (label) { label.textContent = t('hideMyFlights'); }
  closeAchievementGallery();
  if (bounds) map.fitBounds(bounds, { padding: [40, 40] });
}

function escHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 下拉式日期選單：年份範圍為今年-15 ~ 今年+1
function initDateSelectOptions(prefix) {
  const nowY = new Date().getFullYear();
  const yearOpts = [];
  for (let y = nowY + 1; y >= nowY - 15; y--) yearOpts.push(`<option value="${y}">${y}</option>`);
  document.getElementById(`${prefix}-y`).innerHTML = yearOpts.join('');
  document.getElementById(`${prefix}-m`).innerHTML = Array.from({ length: 12 }, (_, i) => i + 1)
    .map(m => `<option value="${m}">${LANG === 'en' ? MONTHS_EN[m - 1] : m + ' 月'}</option>`).join('');
  document.getElementById(`${prefix}-d`).innerHTML = Array.from({ length: 31 }, (_, i) => i + 1)
    .map(d => `<option value="${d}">${LANG === 'en' ? d : d + ' 日'}</option>`).join('');
}
function setDateSelectValue(prefix, dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  document.getElementById(`${prefix}-y`).value = d.getFullYear();
  document.getElementById(`${prefix}-m`).value = d.getMonth() + 1;
  document.getElementById(`${prefix}-d`).value = d.getDate();
  syncDateSelectToHidden(prefix);
}
function syncDateSelectToHidden(prefix) {
  const y = document.getElementById(`${prefix}-y`).value;
  const m = String(document.getElementById(`${prefix}-m`).value).padStart(2, '0');
  const d = String(document.getElementById(`${prefix}-d`).value).padStart(2, '0');
  document.getElementById(prefix).value = `${y}-${m}-${d}`;
}

function getLegGroupForRow(row) {
  if (row.trip_id) {
    const group = flightLogsCache.filter(r => r.trip_id === row.trip_id);
    if (group.length >= 2) {
      return group.slice().sort((a, b) =>
        a.flight_date !== b.flight_date ? a.flight_date.localeCompare(b.flight_date) : (a.created_at || '').localeCompare(b.created_at || ''));
    }
  }
  const pair = row.paired_log_id ? flightLogsCache.find(r => r.id === row.paired_log_id) : null;
  if (pair) {
    const rowIsEarlier = row.flight_date !== pair.flight_date
      ? row.flight_date < pair.flight_date
      : row.created_at <= pair.created_at;
    return rowIsEarlier ? [row, pair] : [pair, row];
  }
  return [row];
}

function editFlightLog(id) {

        <input class="et-flightno" data-leg-id="${leg.id}" value="${leg.flight_no ? escHtml(leg.flight_no) : ''}" placeholder="MU5098">
      </div>
      <div class="flight-log-field">
        <label>${t('dateOnly')}</label>
        <input type="date" class="et-date" data-leg-id="${leg.id}" value="${leg.flight_date || ''}">
      </div>
    </div>
    <div class="flight-log-field">
      <label>${t('legN').replace('{n}', i + 1)}${t('legAirline')}</label>
      <select class="et-airline" data-leg-id="${leg.id}"></select>
    </div>
  `).join('');
  legs.forEach(leg => {
    const sel = container.querySelector(`.et-airline[data-leg-id="${leg.id}"]`);
    if (!sel) return;
    sel.innerHTML = `<option value="">${t('unspecified')}</option>` +
      AIRLINE_IDS.map(aid => `<option value="${aid}">${escHtml(airlineCommercialName(aid))}</option>`).join('');
    sel.value = leg.airline_id || '';
  });
  document.getElementById('et-note').value = legs.map(l => l.note).find(Boolean) || '';
  document.getElementById('et-msg').textContent = '';
  document.getElementById('edit-trip-sheet').classList.add('show');
}

function closeEditTripSheet() {
  editingTripLegs = [];
  document.getElementById('edit-trip-sheet').classList.remove('show');
}

let editTripSubmitting = false;
async function submitEditTripSheet() {
  if (editTripSubmitting) return;
  editTripSubmitting = true;
  try { await submitEditTripSheetImpl(); }
  finally { editTripSubmitting = false; }
}
async function submitEditTripSheetImpl() {
  const msgEl = document.getElementById('et-msg');
  const note = document.getElementById('et-note').value.trim();
  const updates = editingTripLegs.map(leg => ({
    id: leg.id,
    flight_no: document.querySelector(`.et-flightno[data-leg-id="${leg.id}"]`)?.value.trim() || '',
    flight_date: document.querySelector(`.et-date[data-leg-id="${leg.id}"]`)?.value || '',
    airline_id: document.querySelector(`.et-airline[data-leg-id="${leg.id}"]`)?.value || ''
  }));
  if (updates.some(u => !u.flight_date)) {
    msgEl.textContent = t('msgPickEachDate'); msgEl.style.color = 'var(--sd-danger)'; return;
  }
  msgEl.textContent = t('msgUpdating'); msgEl.style.color = 'var(--sd-text-2)';
  try {
    for (const u of updates) {
      const { error } = await supabaseClient.from('flight_logs')
        .update({ flight_no: u.flight_no || null, flight_date: u.flight_date, airline_id: u.airline_id || null, note: note || null })
        .eq('id', u.id);
      if (error) throw error;
    }
    closeEditTripSheet();
    flightLogsCache = await fetchFlightLogs();
    renderFlightLogPanel();
  } catch (error) {
    msgEl.textContent = t('msgUpdateFail'); msgEl.style.color = 'var(--sd-danger)';
  }
}

async function deleteTripFromSheet() {
  if (!editingTripLegs.length) return;
  if (!window.confirm(fmt('confirmDeleteTrip', { n: editingTripLegs.length }))) return;
  const ids = editingTripLegs.map(l => l.id);
  closeEditTripSheet();
  for (const id of ids) await deleteFlightLog(id);
}

function closeAddFlightSheet() {
  editingFlightLogId = null;
  editingPairedLogId = null;
  document.getElementById('af-dep').disabled = false;
  document.getElementById('af-arr').disabled = false;
  document.getElementById('add-flight-sheet').classList.remove('show');
}
let addFlightSubmitting = false;
async function submitAddFlightSheet() {
  if (addFlightSubmitting) return;
  addFlightSubmitting = true;
  const btn = document.getElementById('af-submit-btn');
  if (btn) btn.disabled = true;
  try { await submitAddFlightSheetImpl(); }
  finally { addFlightSubmitting = false; if (btn) btn.disabled = false; }
}
async function submitAddFlightSheetImpl() {
  if (editingFlightLogId) {
    const flightNo = document.getElementById('af-dep-flightno').value.trim();
    const date = document.getElementById('af-dep-date').value;
    const airlineId = document.getElementById('af-dep-airline').value;
    const note = document.getElementById('af-note').value.trim();
    const msgEl = document.getElementById('af-msg');
    if (!date) { msgEl.textContent = t('pleaseSelectDate'); msgEl.style.color = 'var(--sd-danger)'; return; }

    let retFlightNo = '', retAirlineId = '', retDate = '';
    if (editingPairedLogId) {
      retFlightNo = document.getElementById('af-arr-flightno').value.trim();
      retAirlineId = document.getElementById('af-arr-airline').value;
      retDate = document.getElementById('af-arr-date').value;
      if (!retDate) { msgEl.textContent = t('pleaseSelectReturnDate'); msgEl.style.color = 'var(--sd-danger)'; return; }
      if (date > retDate) { msgEl.textContent = t('msgOutboundAfterReturn'); msgEl.style.color = 'var(--sd-danger)'; return; }
    }

    msgEl.textContent = t('msgUpdating'); msgEl.style.color = 'var(--sd-text-2)';
    try {
      const { error } = await supabaseClient.from('flight_logs')
        .update({ flight_no: flightNo || null, flight_date: date, note: note || null, airline_id: airlineId || null })
        .eq('id', editingFlightLogId);
      if (error) throw error;
      if (editingPairedLogId) {
        const { error: retErr } = await supabaseClient.from('flight_logs')
          .update({ flight_no: retFlightNo || null, flight_date: retDate, note: note || null, airline_id: retAirlineId || null })
          .eq('id', editingPairedLogId);
        if (retErr) throw retErr;
      }
      closeAddFlightSheet();
      flightLogsCache = await fetchFlightLogs();
      renderFlightLogPanel();
    } catch (error) {
      msgEl.textContent = t('msgUpdateFail'); msgEl.style.color = 'var(--sd-danger)';
    }
    return;
  }

  const dep = document.getElementById('af-dep').value.trim().toUpperCase();
  const arr = document.getElementById('af-arr').value.trim().toUpperCase();
  const note = document.getElementById('af-note').value.trim();
  const msgEl = document.getElementById('af-msg');
  if (!dep || !arr || dep.length !== 3 || arr.length !== 3) {
    msgEl.textContent = t('msgInvalidIata'); msgEl.style.color = 'var(--sd-danger)'; return;
  }
  if (!window.AIRPORT_MASTER?.[dep] || !window.AIRPORT_MASTER?.[arr]) {
    msgEl.textContent = t('airportNotFound'); msgEl.style.color = 'var(--sd-danger)'; return;
  }
  if (dep === arr) {
    msgEl.textContent = t('msgSameAirport'); msgEl.style.color = 'var(--sd-danger)'; return;
  }

  const depFlightNo = document.getElementById('af-dep-flightno').value.trim();
  const depAirlineId = document.getElementById('af-dep-airline').value;
  const depDate = document.getElementById('af-dep-date').value || todayISO();
  const distanceKm = haversineKm(window.AIRPORT_MASTER[dep].coords, window.AIRPORT_MASTER[arr].coords);

  // 只加單程：維持原本行為，存一筆，並沿用既有的模糊配對機制（30 天內抓反方向的紀錄詢問是否合併）
  if (addFlightOneway) {
    msgEl.textContent = t('msgSaving'); msgEl.style.color = 'var(--sd-text-2)';
    try {
      const { data: inserted, error } = await supabaseClient.from('flight_logs').insert({
        user_id: currentAuthUser.id,
        dep_iata: dep,
        arr_iata: arr,
        flight_no: depFlightNo || null,
        flight_date: depDate,
        distance_km: distanceKm || null,
        note: note || null,
        airline_id: depAirlineId || null
      }).select().single();
      if (error) throw error;
      closeAddFlightSheet();
      flightLogsCache = await fetchFlightLogs();
      renderFlightLogPanel();
      trackAirportAchievements({ iata: arr }, null);
      await maybePairFlightLog(inserted);
    } catch (error) {
      msgEl.textContent = t('msgSaveFail'); msgEl.style.color = 'var(--sd-danger)';
    }
    return;
  }

  // 去回程模式（預設）：一次存兩筆，並直接互相寫入 paired_log_id，不用再靠日期猜測配對
  const retFlightNo = document.getElementById('af-arr-flightno').value.trim();
  const retAirlineId = document.getElementById('af-arr-airline').value;
  const retDate = document.getElementById('af-arr-date').value || depDate;
  if (depDate > retDate) {
    msgEl.textContent = t('msgOutboundAfterReturn'); msgEl.style.color = 'var(--sd-danger)'; return;
  }
  msgEl.textContent = t('msgSaving'); msgEl.style.color = 'var(--sd-text-2)';
  try {
    const { data: outboundRow, error: outErr } = await supabaseClient.from('flight_logs').insert({
      user_id: currentAuthUser.id,
      dep_iata: dep,
      arr_iata: arr,
      flight_no: depFlightNo || null,
      flight_date: depDate,
      distance_km: distanceKm || null,
      note: note || null,
      airline_id: depAirlineId || null
    }).select().single();
    if (outErr) throw outErr;

    const { data: inboundRow, error: inErr } = await supabaseClient.from('flight_logs').insert({
      user_id: currentAuthUser.id,
      dep_iata: arr,
      arr_iata: dep,
      flight_no: retFlightNo || null,
      flight_date: retDate,
      distance_km: distanceKm || null,
      note: note || null,
      airline_id: retAirlineId || null
    }).select().single();
    if (inErr) throw inErr;

    const { error: pairErr1 } = await supabaseClient.from('flight_logs')
      .update({ paired_log_id: inboundRow.id }).eq('id', outboundRow.id);
    if (pairErr1) throw pairErr1;
    const { error: pairErr2 } = await supabaseClient.from('flight_logs')
      .update({ paired_log_id: outboundRow.id }).eq('id', inboundRow.id);
    if (pairErr2) throw pairErr2;

    closeAddFlightSheet();
    flightLogsCache = await fetchFlightLogs();
    renderFlightLogPanel();
    trackAirportAchievements({ iata: arr }, null);
    trackAirportAchievements({ iata: dep }, null);
  } catch (error) {
    msgEl.textContent = t('msgSaveFail'); msgEl.style.color = 'var(--sd-danger)';
  }
}

function authFabClick() {
  const overlay = document.getElementById('auth-overlay');
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
  document.getElementById('auth-msg').textContent = '';
  document.getElementById('auth-step-email').style.display = currentAuthUser ? 'none' : 'block';
  document.getElementById('auth-step-sent').style.display = 'none';
  document.getElementById('auth-step-loggedin').style.display = currentAuthUser ? 'block' : 'none';
  if (currentAuthUser) document.getElementById('auth-current-email').textContent = currentAuthUser.email || '';
  window.setTimeout(() => {
    document.getElementById(currentAuthUser ? 'auth-logout-btn' : 'auth-google-btn')?.focus();
  }, 0);
}
function authClose() {
  const overlay = document.getElementById('auth-overlay');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  // 若使用者是因為「未登入」被彈出這個視窗、但取消/關閉時仍未登入，
  // 把觸發用的按鈕文字（例如「請先登入才能記錄」）還原成原本的文字。
  if (pendingLogButton && !currentAuthUser) {
    pendingLogButton.textContent = pendingLogButton.dataset.defaultText || t("logFlightBtn");
    pendingLogButton.disabled = false;
    pendingLogButton.classList.remove('done');
  }
  pendingLogButton = null;
  if (document.getElementById('achievement-gallery-overlay')?.classList.contains('show')) {
    document.getElementById('achievement-gallery-auth-action')?.focus();
  }
}
async function authLoginWithGoogle() {
  const msgEl = document.getElementById('auth-msg');
  msgEl.textContent = t('msgRedirectGoogle'); msgEl.style.color = 'var(--sd-text-2)';
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.href,
        queryParams: { prompt: 'select_account' }
      }
    });
    if (error) throw error;
  } catch (error) {
    msgEl.textContent = t('msgLoginFail'); msgEl.style.color = 'var(--sd-danger)';
  }
}
async function authLogout() {
  await supabaseClient.auth.signOut();
  // 清除本機的成就/飛行紀錄快取，避免同一裝置換帳號登入時，
  // 上一位使用者殘留在 localStorage 的資料被聯集合併並誤傳到新帳號的雲端。
  localStorage.removeItem(ACHIEVEMENT_STORAGE_KEY);
  flightLogsCache = [];
  flightLogYearFilter = 'all';
  if (myFlightsVisible && myFlightsLayer) {
    map.removeLayer(myFlightsLayer);
    myFlightsLayer = null;
    myFlightsVisible = false;
  }
  resetMyFlightsMapButton();
  refreshAchievementGalleryButton();
  if (document.getElementById('achievement-gallery-overlay')?.classList.contains('show')) {
    if (document.getElementById('gallery-tab-btn-flight')?.classList.contains('active')) {
      renderFlightLogPanel();
    } else {
      renderAchievementGallery();
    }
  }
  authClose();
}
function updateAuthUI(user) {
  currentAuthUser = user;
  const dot = document.getElementById('auth-status-dot');
  if (dot) dot.classList.toggle('logged-in', !!user);
  const galleryStatus = document.getElementById('achievement-gallery-auth-status');
  const galleryAction = document.getElementById('achievement-gallery-auth-action');
  if (galleryStatus) galleryStatus.textContent = user ? (user.email || t('loggedInShort')) : t('notLoggedIn');
  if (galleryAction) galleryAction.textContent = user ? t('logoutBtn') : t('loginBtn');
}
function handleAchievementButtonClick() {
  openAchievementGallery();
}
function handleAchievementAuthAction() {
  if (currentAuthUser) {
    authLogout();
  } else {
    authFabClick();
  }
}
supabaseClient.auth.onAuthStateChange((event, session) => {
  const user = session?.user || null;
  const wasLoggedOut = !currentAuthUser;
  updateAuthUI(user);
  if (user && wasLoggedOut) cloudPullAndMerge();
});
supabaseClient.auth.getSession().then(({ data }) => {
  updateAuthUI(data?.session?.user || null);
});

// Feedback widget handlers
const FEEDBACK_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyyLemZKexsiJmzsBWDUzTuOXwKUzWZV3FLjozjWh58w47iEqD0T7Cl63pXFn-ipCokFQ/exec';
function fbOpen(){ document.getElementById('fb-overlay').classList.add('show'); document.getElementById('fb-msg').textContent=''; }
function fbClose(){ document.getElementById('fb-overlay').classList.remove('show'); }
const FB_STAR_LABELS = LANG === 'en' ? ['','Very Poor','Poor','Average','Good','Excellent'] : ['','非常差','差','普通','好','非常好'];
let fbRating = 0;
function fbHighlight(val){ document.querySelectorAll('.fb-star').forEach(s => s.classList.toggle('active', +s.dataset.val <= val)); }
// fb-star listeners moved inside DOMContentLoaded (see below) to ensure DOM is ready
// and to prevent any exception here from blocking the map initialisation.
async function fbSubmit(){
  const type=document.getElementById('fb-type').value;
  const desc=document.getElementById('fb-desc').value.trim();
  const contact=document.getElementById('fb-contact').value.trim();
  const msgEl=document.getElementById('fb-msg');
  if(!desc){ msgEl.textContent=t('msgEnterContent'); msgEl.style.color='var(--sd-danger)'; return; }
  msgEl.textContent=t('submitting'); msgEl.style.color='var(--sd-text-2)';
  try{
    const res = await fetch(FEEDBACK_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type,description:desc,contact,rating:fbRating||null,page:location.href})});
    if(!res.ok) throw new Error('status '+res.status);
    msgEl.textContent=t('submitSuccess'); msgEl.style.color='var(--sd-success)';
    document.getElementById('fb-desc').value=''; document.getElementById('fb-contact').value='';
    fbRating=0; fbHighlight(0); document.getElementById('fb-star-hint').textContent='';
    setTimeout(fbClose,1200);
  }catch(err){
    msgEl.textContent=t('submitFail'); msgEl.style.color='var(--sd-danger)';
  }
}

// ── Swipe down to dismiss (gallery + add/edit flight sheets) ──────────────
function attachSwipeDownToClose(panel, handle, close) {
  if (!panel || !handle) return;
  const mobileQuery = window.matchMedia("(max-width: 860px), (pointer: coarse)");
  let startY = 0, dy = 0, dragging = false;
  handle.style.touchAction = "none";
  handle.addEventListener("touchstart", (e) => {
    if (!mobileQuery.matches || e.touches.length !== 1) return;
    startY = e.touches[0].clientY; dy = 0; dragging = true;
    panel.style.transition = "none";
  }, { passive: true });
  handle.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    panel.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (dy > 90) {
      panel.style.transition = "transform 200ms cubic-bezier(.22,1,.36,1)";
      panel.style.transform = "translateY(100%)";
      window.setTimeout(() => { panel.style.transition = ""; panel.style.transform = ""; close(); }, 200);
    } else {
      panel.style.transition = "transform 200ms cubic-bezier(.22,1,.36,1)";
      panel.style.transform = "";
      window.setTimeout(() => { panel.style.transition = ""; }, 200);
    }
  };
  handle.addEventListener("touchend", end);
  handle.addEventListener("touchcancel", end);
}
attachSwipeDownToClose(document.querySelector(".achievement-gallery-panel"), document.querySelector(".achievement-gallery-header"), closeAchievementGallery);
attachSwipeDownToClose(document.querySelector("#add-flight-sheet .flight-log-sheet"), document.querySelector("#add-flight-sheet .flight-log-sheet-header"), closeAddFlightSheet);
attachSwipeDownToClose(document.querySelector("#edit-trip-sheet .flight-log-sheet"), document.querySelector("#edit-trip-sheet .flight-log-sheet-header"), closeEditTripSheet);
