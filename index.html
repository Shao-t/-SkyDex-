  <style>
    /* ══════════════════════════════════════════════════════════════
       SkyDex UI v2 — design tokens (global) + map layer
       One set of rules per component; no light/dark override layers.
       ══════════════════════════════════════════════════════════════ */
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --sd-bg: #0B0F14;
      --sd-surface: #151B23;
      --sd-surface-2: #1C232D;
      --sd-text: #F5F5F7;
      --sd-text-2: #9CA3AF;
      --sd-text-3: #636B78;
      --sd-accent: #F6C84A;
      --sd-accent-ink: #0B0F14;
      --sd-divider: #262D37;
      --sd-danger: #FF453A;
      --sd-success: #30D158;
      --sd-s1: 8px; --sd-s2: 12px; --sd-s3: 16px; --sd-s4: 24px; --sd-s5: 32px; --sd-s6: 40px;
      --sd-r-sm: 12px; --sd-r-md: 16px; --sd-r-lg: 20px;
      --sd-pad: 20px;
      --sd-ease: cubic-bezier(.22, 1, .36, 1);
      --sd-fast: 140ms; --sd-base: 240ms;
      --sd-float-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
    button, input, select, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: var(--font-ui); background: var(--sd-bg); color: var(--sd-text);
      overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
    }
    #app { position: relative; width: 100%; height: var(--app-height, 100vh); min-height: 100vh; min-height: 100dvh; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; background: var(--sd-bg); }

    /* ── Map / Leaflet ─────────────────────────────────────────── */
    .leaflet-container { font-family: var(--font-ui); }
    .leaflet-tile { filter: saturate(.58) brightness(.78) contrast(1.08) hue-rotate(4deg); }
    .hub-label-name { display: none; }
    .zoomed-in-labels .hub-label-name { display: inline; }
    .leaflet-control-zoom { display: none !important; }
    .leaflet-control-attribution {
      background: rgba(11, 15, 20, .72) !important; color: var(--sd-text-3) !important;
      font-size: 10px !important; padding: 0 6px !important;
    }
    .leaflet-control-attribution a { color: var(--sd-text-2) !important; }
    .leaflet-tooltip {
      background: transparent !important; border: none !important; box-shadow: none !important;
      color: rgba(240, 244, 249, .86) !important; font-family: var(--font-ui) !important;
      font-size: 10px !important; font-weight: 500 !important; padding: 0 !important; white-space: nowrap !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .85);
    }

    /* Route popup (Leaflet popup rendered into a portal layer) */
    #route-popup-layer { position: fixed; inset: 0; z-index: 36; pointer-events: none; }
    #route-popup-layer .route-popup-portal { position: absolute; margin: 0; pointer-events: auto; }
    #route-popup-layer .leaflet-popup-tip-container { position: absolute; left: var(--route-popup-tip-left, 50%); width: 40px; height: 20px; margin-left: -20px; overflow: hidden; pointer-events: none; }
    #route-popup-layer .leaflet-popup-tip { width: 17px; height: 17px; margin: -10px auto 0; padding: 1px; transform: rotate(45deg); }
    .route-popup .leaflet-popup-content-wrapper {
      background: var(--sd-surface); color: var(--sd-text);
      border: 1px solid var(--sd-divider); border-radius: var(--sd-r-md); box-shadow: var(--sd-float-shadow);
      transform-origin: 50% 100%; animation: popup-spring-in var(--sd-base) var(--sd-ease) both;
    }
    .route-popup .leaflet-popup-content { margin: var(--sd-s3); color: var(--sd-text); font-family: var(--font-ui); }
    .route-popup .leaflet-popup-tip { background: var(--sd-surface); box-shadow: none; }
    .route-popup .leaflet-popup-tip-container { animation: popup-tip-in 200ms ease-out both; }
    .route-popup-shell { min-width: 180px; max-width: 260px; }
    .route-popup-header { display: flex; align-items: baseline; gap: var(--sd-s1); margin-bottom: var(--sd-s2); }
    .route-popup-iata { color: var(--sd-text); font-size: 24px; font-weight: 700; letter-spacing: .01em; }
    .route-popup-city { color: var(--sd-text-2); font-size: 14px; }
    .route-popup-rows { display: flex; flex-direction: column; gap: var(--sd-s1); }
    .route-popup-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sd-s1); }
    .route-popup-key { color: var(--sd-text-2); font-size: 13px; line-height: 1.35; flex-shrink: 0; }
    .route-popup-val { color: var(--sd-text); font-size: 13px; font-weight: 500; text-align: right; line-height: 1.35; }
    .route-popup-log-btn {
      width: 100%; min-height: 40px; margin-top: var(--sd-s2); padding: 0 var(--sd-s2); border: 0; border-radius: var(--sd-r-sm);
      background: var(--sd-surface-2); color: var(--sd-text); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: filter var(--sd-fast) ease, transform var(--sd-fast) var(--sd-ease);
    }
    .route-popup-log-btn:active { transform: scale(.98); }
    @media (hover: hover) { .route-popup-log-btn:hover { filter: brightness(1.12); } }
    .route-popup-log-btn.done { color: var(--sd-success); cursor: default; }
    .route-stop-marker-wrap { background: transparent; border: 0; }
    .route-stop-marker {
      display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; padding: 0 var(--sd-s1);
      border: 1px solid var(--sd-divider); border-radius: 8px; background: var(--sd-bg); color: var(--sd-text);
      font-size: 12px; font-weight: 700; letter-spacing: .04em; transform: translate(-50%, -50%); pointer-events: none;
    }
    .origin-pick-list { display: flex; flex-direction: column; gap: 4px; }
    .origin-pick-btn {
      display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 40px; padding: 0 var(--sd-s2);
      border: 0; border-radius: var(--sd-r-sm); background: var(--sd-surface-2); color: var(--sd-text);
      font-size: 14px; font-weight: 500; text-align: left; cursor: pointer;
    }
    @media (hover: hover) { .origin-pick-btn:hover { filter: brightness(1.12); } }

    /* Map feedback animations (unchanged) */
    .leaflet-overlay-pane svg path.airport-marker-spring { transform-box: fill-box; transform-origin: center; animation: airport-marker-spring 480ms cubic-bezier(.22,1,.36,1) both; }
    .leaflet-overlay-pane svg path.airport-arrival-ring { transform-box: fill-box; transform-origin: center; animation: airport-arrival-ring 680ms cubic-bezier(.16,1,.3,1) both; pointer-events: none; }
    .leaflet-overlay-pane svg path.route-line-drawing { stroke-linecap: round; pointer-events: none; }
    .leaflet-overlay-pane svg path.airline-marker-enter { transform-box: fill-box; transform-origin: center; animation: airline-marker-enter 480ms cubic-bezier(.18,1.28,.38,1) both; animation-delay: var(--marker-delay, 0ms); }
    .leaflet-overlay-pane svg path.airline-marker-exit { transform-box: fill-box; transform-origin: center; animation: airline-marker-exit 170ms cubic-bezier(.4,0,1,1) both; pointer-events: none; }
    .leaflet-overlay-pane svg path.airport-selected-ring { transform-box: fill-box; transform-origin: center; animation: airport-selected-ring-in 420ms cubic-bezier(.18,1.28,.38,1) both; pointer-events: none; stroke-linecap: round; }
    @keyframes airport-marker-spring { 0%   { transform: scale(1); } 20%  { transform: scale(.88); } 55%  { transform: scale(1.28); } 76%  { transform: scale(.96); } 100% { transform: scale(1); } }
    @keyframes airport-arrival-ring { 0%   { opacity: .9; transform: scale(.55); } 70%  { opacity: .28; } 100% { opacity: 0; transform: scale(2.15); } }
    @keyframes airline-marker-enter { 0%   { opacity: 0; transform: scale(.45); } 58%  { opacity: 1; transform: scale(1.18); } 78%  { transform: scale(.96); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes airline-marker-exit { 0%   { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.68); } }
    @keyframes airport-selected-ring-in { 0%   { opacity: 0; transform: scale(.55); } 58%  { opacity: .95; transform: scale(1.15); } 80%  { transform: scale(.97); } 100% { opacity: .86; transform: scale(1); } }
    @keyframes popup-spring-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes popup-tip-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes picker-option-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    /* ── Header ────────────────────────────────────────────────── */
    #header {
      position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 16px; right: 16px; z-index: 25;
      display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sd-s1); pointer-events: none;
    }
    #header-left, #header-right { display: flex; align-items: center; gap: var(--sd-s1); pointer-events: auto; }
    #header-left { padding: var(--sd-s1); background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-md); }
    #header-right { margin-left: auto; }
    #cockpit-brand { padding: 0 var(--sd-s2) 0 var(--sd-s1); }
    .cockpit-brand-kicker { display: none; }
    .cockpit-brand-title { color: var(--sd-text); font-size: 17px; font-weight: 600; white-space: nowrap; }
    #airline-picker { position: relative; }
    #airline-chip {
      display: flex; align-items: center; gap: var(--sd-s1); min-height: 40px; padding: 0 var(--sd-s2);
      border: 0; border-radius: var(--sd-r-sm); background: var(--sd-surface-2); color: var(--sd-text);
      cursor: pointer; -webkit-appearance: none; appearance: none;
      transition: filter var(--sd-fast) ease, transform var(--sd-fast) var(--sd-ease);
    }
    #airline-chip:active { transform: scale(.98); }
    @media (hover: hover) { #airline-chip:hover { filter: brightness(1.12); } }
    .airline-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .airline-chip-label { color: var(--sd-text); font-size: 14px; font-weight: 600; white-space: nowrap; }
    .airline-chip-chevron { color: var(--sd-text-3); flex-shrink: 0; transition: transform var(--sd-base) var(--sd-ease); }
    #airline-chip.open .airline-chip-chevron { transform: rotate(180deg); }
    #airline-picker-panel {
      display: grid; position: absolute; top: calc(100% + 12px); left: -8px; grid-template-columns: repeat(2, minmax(126px, 1fr));
      gap: 4px; width: max-content; max-width: 300px; padding: var(--sd-s1); z-index: 30;
      background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-md); box-shadow: var(--sd-float-shadow);
      opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-6px); transform-origin: 24px 0;
      transition: opacity 150ms ease-out, transform var(--sd-base) var(--sd-ease), visibility 0s linear var(--sd-base);
    }
    #airline-picker-panel.open { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }
    #airline-picker-panel.open .picker-option { animation: picker-option-in 200ms var(--sd-ease) both; animation-delay: calc(var(--option-index, 0) * 20ms + 20ms); }
    .picker-option {
      display: flex; align-items: center; gap: var(--sd-s1); min-height: 40px; padding: 0 var(--sd-s2);
      border: 0; border-radius: var(--sd-r-sm); background: transparent; color: var(--sd-text);
      font-size: 14px; text-align: left; cursor: pointer; -webkit-appearance: none; appearance: none;
    }
    .picker-option:hover { background: var(--sd-surface-2); }
    .picker-option.active { background: var(--sd-surface-2); font-weight: 600; }
    .picker-option-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .picker-option-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-option-check { color: var(--sd-text-2); flex-shrink: 0; }
    .stat-value { font-size: 15px; font-weight: 600; }

    /* Header buttons: language · achievements · feedback (one component) */
    .lang-toggle-btn, .achievement-gallery-button, .fb-fab {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--sd-s1);
      min-width: 40px; min-height: 40px; padding: 0 var(--sd-s2);
      border: 1px solid var(--sd-divider); border-radius: var(--sd-r-sm); background: var(--sd-surface); color: var(--sd-text);
      font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; touch-action: manipulation;
      transition: filter var(--sd-fast) ease, transform var(--sd-fast) var(--sd-ease);
    }
    .lang-toggle-btn:active, .achievement-gallery-button:active, .fb-fab:active { transform: scale(.97); }
    @media (hover: hover) { .lang-toggle-btn:hover, .achievement-gallery-button:hover, .fb-fab:hover { filter: brightness(1.15); } }
    .achievement-gallery-button svg, .fb-fab svg { flex: 0 0 auto; display: block; }
    #achievement-gallery-button-count { color: var(--sd-accent); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #auth-status-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--sd-text-3); }
    #auth-status-dot.logged-in { background: var(--sd-success); }

    /* ── Search ────────────────────────────────────────────────── */
    #search-wrap {
      position: absolute; top: calc(82px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      z-index: 21; width: min(390px, calc(100vw - 32px));
    }
    #search-inner { position: relative; }
    #search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    #search-icon circle, #search-icon path { stroke: var(--sd-text-3); }
    #search-input {
      width: 100%; height: 44px; padding: 0 14px 0 42px; outline: none;
      background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-md);
      color: var(--sd-text); font-size: 16px; transition: border-color var(--sd-fast) ease;
    }
    #search-input::placeholder { color: var(--sd-text-3); }
    #search-input:focus { border-color: var(--sd-text-3); }
    #search-results {
      display: none; margin-top: var(--sd-s1); max-height: min(58vh, 430px); overflow-y: auto;
      background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-md); box-shadow: var(--sd-float-shadow);
    }
    .global-result-item {
      display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: var(--sd-s2);
      padding: var(--sd-s2); cursor: pointer; border-bottom: 1px solid var(--sd-divider);
      transition: background var(--sd-fast) ease;
    }
    .global-result-item:last-child { border-bottom: 0; }
    .global-result-item:hover { background: var(--sd-surface-2); }
    .global-airline-code {
      display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 28px; border-radius: 8px;
      background: color-mix(in srgb, var(--airline-color) 22%, transparent); color: var(--sd-text);
      font-size: 12px; font-weight: 600; letter-spacing: .04em;
    }
    .global-result-main { min-width: 0; }
    .global-result-route { display: flex; align-items: baseline; gap: var(--sd-s1); min-width: 0; color: var(--sd-text); font-size: 14px; font-weight: 600; }
    .global-result-city { color: var(--sd-text-2); font-size: 12px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .global-result-airline { margin-top: 2px; color: var(--sd-text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .global-result-status { color: var(--sd-text-3); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .global-search-empty { padding: var(--sd-s4) var(--sd-s3); text-align: center; color: var(--sd-text-3); font-size: 14px; }

    /* ── Route filters ─────────────────────────────────────────── */
    #filter-bar { display: flex; align-items: center; justify-content: center; gap: var(--sd-s1); margin-top: var(--sd-s1); pointer-events: auto; }
    #filter-trigger {
      display: inline-flex; align-items: center; gap: var(--sd-s1); height: 36px; padding: 0 var(--sd-s2);
      border: 1px solid var(--sd-divider); border-radius: var(--sd-r-sm); background: var(--sd-surface); color: var(--sd-text);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: filter var(--sd-fast) ease, transform var(--sd-fast) var(--sd-ease), border-color var(--sd-fast) ease;
    }
    #filter-trigger:active { transform: scale(.97); }
    @media (hover: hover) { #filter-trigger:hover { filter: brightness(1.15); } }
    #filter-trigger.is-active { border-color: var(--filter-accent, var(--sd-text-3)); }
    #filter-trigger svg { flex: 0 0 auto; }
    #filter-count-badge {
      min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--sd-accent-ink); background: var(--sd-accent); font-size: 12px; font-weight: 600;
    }
    #filter-count-badge[hidden] { display: none; }
    #filter-backdrop {
      position: fixed; inset: 0; z-index: 34; display: none; background: rgba(0, 0, 0, .6);
      opacity: 0; pointer-events: none; transition: opacity var(--sd-base) ease;
    }
    #filter-panel {
      position: fixed; z-index: 35; left: 50%; top: 150px; width: min(410px, calc(100vw - 28px));
      max-height: min(620px, calc(100vh - 180px)); max-height: min(620px, calc(100dvh - 180px)); display: flex; flex-direction: column; overflow: hidden;
      color: var(--sd-text); background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-lg); box-shadow: var(--sd-float-shadow);
      opacity: 0; visibility: hidden; pointer-events: none; transform: translate(-50%, -8px); transform-origin: 50% 0;
      transition: opacity 180ms ease, visibility 0s linear var(--sd-base), transform var(--sd-base) var(--sd-ease);
    }
    #filter-panel.open { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0); transition-delay: 0s; }
    .filter-sheet-handle { display: none; }
    .filter-panel-header { display: flex; align-items: center; justify-content: space-between; gap: var(--sd-s2); padding: var(--sd-s4) var(--sd-pad) var(--sd-s2); }
    .filter-title-wrap { min-width: 0; }
    .filter-eyebrow { display: none; }
    .filter-title { display: flex; align-items: baseline; gap: var(--sd-s1); font-size: 17px; font-weight: 600; }
    .filter-title-dest { color: var(--sd-text-3); font-size: 12px; white-space: nowrap; }
    .filter-title-dest .stat-value { color: var(--sd-text); font-size: 14px; font-weight: 600; margin-right: 2px; }
    .filter-close {
      position: relative; width: 32px; height: 32px; border: 0; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
      color: var(--sd-text-2); background: var(--sd-surface-2); cursor: pointer; transition: transform var(--sd-fast) var(--sd-ease);
    }
    .filter-close::before { content: ""; position: absolute; inset: -6px; }
    .filter-close:active { transform: scale(.94); }
    #filter-groups { overflow: auto; padding: 4px var(--sd-pad) var(--sd-s2); overscroll-behavior: contain; }
    .filter-group { padding: var(--sd-s3) 0; border-bottom: 1px solid var(--sd-divider); }
    .filter-group:last-child { border-bottom: 0; }
    .filter-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sd-s2); margin-bottom: var(--sd-s2); }
    .filter-group-title { font-size: 14px; font-weight: 600; }
    .filter-group-note { color: var(--sd-text-3); font-size: 12px; }
    .filter-chip-list { display: flex; flex-wrap: wrap; gap: var(--sd-s1); }
    .filter-chip {
      min-height: 36px; padding: 0 var(--sd-s2); border: 0; border-radius: var(--sd-r-sm); display: inline-flex; align-items: center; gap: 6px;
      color: var(--sd-text-2); background: var(--sd-surface-2); cursor: pointer; font-size: 13px; font-weight: 600;
      transition: transform var(--sd-fast) var(--sd-ease), color var(--sd-fast) ease, box-shadow var(--sd-fast) ease;
    }
    .filter-chip:hover { color: var(--sd-text); }
    .filter-chip:active { transform: scale(.97); }
    .filter-chip.active { color: var(--sd-text); box-shadow: inset 0 0 0 1.5px var(--filter-accent, var(--sd-text-3)); }
    .filter-chip-count { color: var(--sd-text-3); font-size: 12px; }

    .filter-panel-footer {
      padding: var(--sd-s2) var(--sd-pad) calc(var(--sd-s2) + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; gap: var(--sd-s2); border-top: 1px solid var(--sd-divider);
    }
    .filter-footer-result { color: var(--sd-text-2); font-size: 12px; line-height: 1.4; }

    #filter-reset {
      min-height: 40px; padding: 0 var(--sd-s3); border: 0; border-radius: var(--sd-r-sm);

    }
    #filter-empty { display: none; padding: var(--sd-s2); margin-top: var(--sd-s2); border-radius: var(--sd-r-sm); color: var(--sd-danger); background: var(--sd-surface-2); font-size: 14px; line-height: 1.4; }

    /* ── Airport info drawer ───────────────────────────────────── */
    #info-card {
      position: absolute; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20;
      width: min(560px, calc(100vw - 120px)); max-width: 560px; padding: var(--sd-s2) var(--sd-pad) var(--sd-pad);
      color: var(--sd-text); background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-lg); box-shadow: var(--sd-float-shadow);
      max-height: 70vh; max-height: 70dvh; overflow-y: auto; overscroll-behavior: contain;
      opacity: 0; transform: translate(-50%, 16px);
      transition: opacity 200ms ease, transform var(--sd-base) var(--sd-ease);
    }
    #info-card::before { content: ""; display: block; width: 36px; height: 5px; margin: 0 auto var(--sd-s2); border-radius: 3px; background: var(--sd-text-3); opacity: .6; }
    #info-card[style*='opacity: 1'], #info-card[style*='opacity:1'] { transform: translate(-50%, 0) !important; }
    .drawer-kicker { display: none; }
    .card-header { display: flex; align-items: baseline; gap: var(--sd-s1); margin-bottom: var(--sd-s2); }
    .card-iata { color: var(--sd-text); font-size: 28px; font-weight: 700; letter-spacing: .01em; }
    .card-city { color: var(--sd-text-2); font-size: 15px; }
    .info-card-close {
      position: relative; width: 32px; height: 32px; border: 0; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
      margin-left: auto; align-self: flex-start; color: var(--sd-text-2); background: var(--sd-surface-2); cursor: pointer;
      transition: transform var(--sd-fast) var(--sd-ease);
    }
    .info-card-close::before { content: ""; position: absolute; inset: -6px; }
    .info-card-close:active { transform: scale(.94); }
    .card-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--sd-s4); }
    .card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sd-s1); padding: 10px 0; border-top: 1px solid var(--sd-divider); }
    .card-key { color: var(--sd-text-2); font-size: 14px; line-height: 1.35; flex-shrink: 0; }
    .card-val { color: var(--sd-text); font-size: 14px; font-weight: 500; text-align: right; line-height: 1.35; }

    /* ── Zoom ──────────────────────────────────────────────────── */
    #zoom-ctrl {
      position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); right: 18px; z-index: 20;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--sd-surface); border: 1px solid var(--sd-divider); border-radius: var(--sd-r-sm);
    }
    .zoom-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      color: var(--sd-text); font-size: 20px; line-height: 1; user-select: none; transition: background var(--sd-fast) ease;
    }
    .zoom-btn:hover { background: var(--sd-surface-2); }
    .zoom-btn.zoom-out { border-top: 1px solid var(--sd-divider); }

    /* ── Feedback & login dialogs ──────────────────────────────── */
    .fb-overlay {
      position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
      padding: var(--sd-s3); background: rgba(0, 0, 0, .6);
    }

    #auth-overlay { z-index: 2300; }
    .fb-box {
      width: min(400px, 100%); padding: var(--sd-s4); color: var(--sd-text);
      background: var(--sd-surface); border-radius: var(--sd-r-lg); color-scheme: dark;
    }
    .fb-overlay.show .fb-box { animation: sd-rise var(--sd-base) var(--sd-ease); }
    .fb-box h3 { margin: 0 0 var(--sd-s3); font-size: 17px; font-weight: 600; color: var(--sd-text); }
    .fb-text { margin-bottom: var(--sd-s2); color: var(--sd-text-2); font-size: 14px; line-height: 1.5; }
    .fb-box select, .fb-box textarea, .fb-box input {
      width: 100%; padding: var(--sd-s2); margin-bottom: var(--sd-s1); border: 0; border-radius: var(--sd-r-sm);
      background: var(--sd-surface-2); color: var(--sd-text); font-size: 16px; outline: none;
    }
    .fb-box textarea { resize: none; height: 96px; line-height: 1.5; }
    .fb-box input::placeholder, .fb-box textarea::placeholder { color: var(--sd-text-3); }
    .fb-actions { display: flex; justify-content: flex-end; gap: var(--sd-s1); margin-top: var(--sd-s1); }
    .fb-actions button {
      min-height: 44px; padding: 0 var(--sd-s4); border: 0; border-radius: var(--sd-r-sm); cursor: pointer;
      background: var(--sd-surface-2); color: var(--sd-text); font-size: 14px; font-weight: 600;
      transition: transform var(--sd-fast) var(--sd-ease);
    }
    .fb-actions button:active { transform: scale(.97); }
    .fb-actions .fb-cancel-btn { background: none; color: var(--sd-text-2); }
    #fb-send, #auth-google-btn { background: var(--sd-accent); color: var(--sd-accent-ink); }
    .fb-star-row { display: flex; gap: 4px; margin-bottom: var(--sd-s1); }
    .fb-star { font-size: 22px; cursor: pointer; color: var(--sd-text-3); transition: color var(--sd-fast) ease; }
    .fb-star.active, .fb-star:hover { color: var(--sd-accent); }
    .fb-star-hint { min-height: 16px; margin-bottom: var(--sd-s1); color: var(--sd-text-3); font-size: 12px; }
    .fb-msg { min-height: 20px; margin-top: var(--sd-s1); font-size: 14px; }

    /* ── Touch / narrow screens ────────────────────────────────── */
    @media (max-width: 860px), (pointer: coarse) {
      .leaflet-tooltip { font-size: 11px !important; }
      #header { top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px; }
      #header-left { flex: 1; min-width: 0; padding: 6px; }
      #cockpit-brand { min-width: 0; max-width: 104px; padding-left: 6px; }
      .cockpit-brand-title { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
      #airline-picker { flex: 1; min-width: 0; }
      #airline-chip { width: 100%; min-width: 0; padding: 0 10px; }
      .airline-chip-label { flex: 1; overflow: hidden; text-overflow: ellipsis; text-align: left; }
      #airline-picker-panel { position: fixed; top: 0; left: 12px; right: 12px; width: auto; max-width: none; grid-template-columns: 1fr 1fr; margin-top: 0; }
      .lang-toggle-btn, .achievement-gallery-button, .fb-fab { width: 44px; height: 44px; min-height: 44px; padding: 0; }
      .achievement-gallery-button-label, #achievement-gallery-button-count, .fb-fab-label { display: none; }
      #search-wrap { top: calc(72px + env(safe-area-inset-top)); }
      #search-results { max-height: 48vh; }
      .global-result-item { grid-template-columns: 40px minmax(0, 1fr); }
      .global-result-status { grid-column: 2; justify-self: start; margin-top: -3px; }
      #info-card {
        left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: auto; max-width: none; z-index: 24;
        pointer-events: none; transform: translateY(16px);
      }
      #info-card[style*='opacity: 1'], #info-card[style*='opacity:1'] { transform: translateY(0) !important; pointer-events: auto; }
      .card-rows { grid-template-columns: 1fr; }
      .card-row { padding: 7px 0; }
      .card-key, .card-val { font-size: 13px; }
      #info-card { max-height: 58vh; max-height: 58dvh; }
      #zoom-ctrl { right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 19; }
      .zoom-btn { width: 44px; height: 44px; }
      #filter-bar { margin-top: 7px; }
      #filter-backdrop { display: block; }
      #filter-backdrop.open { opacity: 1; pointer-events: auto; }
      #filter-panel {
        left: 0; right: 0; top: auto !important; bottom: 0; width: 100%; max-height: min(78vh, 680px); max-height: min(78dvh, 680px);
        border-width: 1px 0 0; border-radius: var(--sd-r-lg) var(--sd-r-lg) 0 0; box-shadow: none;
        transform: translateY(104%); transform-origin: 50% 100%; opacity: 1; visibility: visible;
        transition: transform var(--sd-base) var(--sd-ease);
      }
      #filter-panel.open { transform: translateY(0); }
      .filter-sheet-handle { display: block; width: 36px; height: 5px; margin: var(--sd-s1) auto 0; border-radius: 3px; background: var(--sd-text-3); opacity: .6; }
      .filter-panel-header { padding-top: var(--sd-s2); }
      #filter-groups, .filter-panel-footer { padding-left: var(--sd-s3); padding-right: var(--sd-s3); }
      body.filter-open #map { pointer-events: none; }
    }
    @media (max-width: 360px) { #cockpit-brand { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .route-popup .leaflet-popup-content-wrapper, .route-popup .leaflet-popup-tip-container,
      .leaflet-overlay-pane svg path.airport-marker-spring, .leaflet-overlay-pane svg path.airport-arrival-ring,
      .leaflet-overlay-pane svg path.airline-marker-enter, .leaflet-overlay-pane svg path.airline-marker-exit,
      .leaflet-overlay-pane svg path.airport-selected-ring, #airline-picker-panel.open .picker-option,
      .fb-overlay.show, .fb-overlay.show .fb-box { animation: none !important; }
      #filter-panel, #filter-backdrop, #filter-trigger, .filter-chip, #search-input, #info-card, #airline-chip, #airline-picker-panel { transition-duration: 0.01ms !important; }
    }


    /* ══════════════════════════════════════════════════════════════
       SkyDex UI v2 — achievement toast, achievement gallery, flight log,
       journey cards, add / edit flight sheets (tokens come from :root above).
       ══════════════════════════════════════════════════════════════ */
    #achievement-toast button,
    #achievement-gallery-overlay button,
    .flight-log-sheet-backdrop button,
    .flight-log-sheet-backdrop input,
    .flight-log-sheet-backdrop select,
    .flight-log-sheet-backdrop textarea {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    #achievement-gallery-overlay :focus-visible,
    .flight-log-sheet-backdrop :focus-visible {
      outline: 2px solid var(--sd-accent); outline-offset: 2px;
    }
    @keyframes sd-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sd-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* ── Achievement toast ─────────────────────────────────────── */
    #achievement-toast {
      position: fixed; z-index: 1900; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      width: min(390px, calc(100vw - 32px));
      display: flex; align-items: center; gap: var(--sd-s2);
      padding: var(--sd-s3) 48px var(--sd-s3) var(--sd-s3); border-radius: var(--sd-r-md);
      color: var(--sd-text); background: var(--sd-surface-2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
      opacity: 0; pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity var(--sd-base) var(--sd-ease), transform var(--sd-base) var(--sd-ease);
    }
    #achievement-toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .achievement-seal {
      position: relative; flex: 0 0 56px; width: 56px; height: 56px;
      display: grid; place-items: center; border-radius: 50%;
      color: var(--sd-text); background: var(--sd-surface);
      font-size: 16px; font-weight: 600;
    }
    .achievement-seal img { width: 68px; height: 68px; display: none; object-fit: contain; }
    .achievement-seal.has-badge { background: transparent; }
    .achievement-seal.has-badge img { display: block; }
    .achievement-seal.has-badge .achievement-badge-fallback { display: none; }
    .achievement-badge-fallback { line-height: 1; }
    .achievement-seal small {
      position: absolute; right: -4px; bottom: -2px; min-width: 20px; height: 20px;
      display: grid; place-items: center; padding: 0 6px; border-radius: 10px; white-space: nowrap;
      color: var(--sd-accent-ink); background: var(--sd-accent);
      border: 2px solid var(--sd-surface-2);
      font-size: 12px; font-weight: 600;
    }
    .achievement-copy { min-width: 0; }
    .achievement-kicker { color: var(--sd-text-2); font-size: 12px; font-weight: 500; }
    #achievement-toast.unlocked .achievement-kicker { color: var(--sd-accent); }
    #achievement-title { display: block; margin-top: 2px; font-size: 17px; font-weight: 600; line-height: 1.25; }
    #achievement-detail { margin: 4px 0 0; color: var(--sd-text-2); font-size: 14px; line-height: 1.4; }
    .achievement-close {
      position: absolute; top: 6px; right: 6px; width: 40px; height: 40px;
      border: 0; border-radius: var(--sd-r-sm); color: var(--sd-text-3); background: transparent;
      cursor: pointer; font-size: 20px; line-height: 1;
      transition: color var(--sd-fast) ease;
    }
    .achievement-close:hover { color: var(--sd-text); }
    #achievement-confetti {
      position: fixed; inset: 0; z-index: 2050; overflow: hidden;
      pointer-events: none;
    }
    .achievement-confetti-piece {
      position: absolute; top: -10vh; left: 0;
      width: var(--size); height: 4px;
      border-radius: 2px; background: var(--color);
      transform: translate3d(var(--x), -12vh, 0) rotate(0deg);
      animation: achievement-confetti-fall var(--duration) cubic-bezier(.16,.7,.35,1) var(--delay) forwards;
    }
    @keyframes achievement-confetti-fall {
      to { transform: translate3d(calc(var(--x) + var(--drift)), 112vh, 0) rotate(var(--spin)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #achievement-confetti { display: none; }
    }

    /* ── Achievement gallery shell ─────────────────────────────── */
    #achievement-gallery-overlay {
      position: fixed; inset: 0; z-index: 2100; display: none;
      align-items: center; justify-content: center; padding: var(--sd-s4);
      background: rgba(0, 0, 0, .6);
    }
    #achievement-gallery-overlay.show { display: flex; animation: sd-fade var(--sd-base) ease-out; }
    .achievement-gallery-panel {
      width: min(880px, 96vw); max-height: min(820px, calc(var(--app-height, 100vh) * 0.9)); overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      color: var(--sd-text); background: var(--sd-bg); border-radius: var(--sd-r-lg);
    }
    #achievement-gallery-overlay.show .achievement-gallery-panel { animation: sd-rise var(--sd-base) var(--sd-ease); }
    .achievement-gallery-header {
      position: relative;
      display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 4px var(--sd-s2);
      padding: var(--sd-s4) var(--sd-pad) 0;
    }
    .achievement-gallery-eyebrow { display: none; }
    .achievement-gallery-header h2 { margin: 0 0 4px; font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
    #achievement-gallery-summary { color: var(--sd-text-2); font-size: 14px; line-height: 1.4; }
    #achievement-gallery-summary strong { color: var(--sd-text); font-size: inherit; font-weight: 600; }
    .achievement-gallery-close {
      position: relative; width: 32px; height: 32px; flex: 0 0 auto; border: 0; border-radius: 50%;
      display: grid; place-items: center;
      color: var(--sd-text-2); background: var(--sd-surface-2);
      cursor: pointer; touch-action: manipulation;
      transition: color var(--sd-fast) ease, transform var(--sd-fast) var(--sd-ease);
    }
    .achievement-gallery-close::before { content: ""; position: absolute; inset: -6px; }
    .achievement-gallery-close:hover { color: var(--sd-text); }
    .achievement-gallery-close:active { transform: scale(.94); }
    .achievement-gallery-auth-row {
      grid-column: 1 / -1; display: flex; align-items: center; gap: var(--sd-s1);
      color: var(--sd-text-3); font-size: 14px;
    }
    .achievement-gallery-auth-row button {
      flex: 0 0 auto; white-space: nowrap;
      border: 0; background: none; padding: 4px 0; color: var(--sd-text);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .gallery-tabbar {
      display: flex; gap: 2px; margin: var(--sd-s2) var(--sd-pad); padding: 2px;
      background: var(--sd-surface); border-radius: var(--sd-r-sm);
    }
    .gallery-tab-btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 var(--sd-s2); border: 0; border-radius: 10px;
      background: transparent; color: var(--sd-text-2);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background var(--sd-fast) ease, color var(--sd-fast) ease;
    }
    .gallery-tab-btn.active { color: var(--sd-text); background: var(--sd-surface-2); }
    .gallery-tab-panel {
      display: none;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .gallery-tab-panel.active { display: flex; flex-direction: column; animation: sd-fade 200ms ease-out; }
    #gallery-tab-flight {
      overflow-y: auto;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    }

    /* ── Achievement tiles ─────────────────────────────────────── */
    #achievement-gallery-grid {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: var(--sd-s2) var(--sd-pad) calc(var(--sd-s4) + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sd-s2);
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    }
    .achievement-gallery-card {
      min-width: 0; padding: var(--sd-s3); border-radius: var(--sd-r-md);
      background: var(--sd-surface); display: flex; flex-direction: column;
    }
    .achievement-gallery-badge { height: 112px; display: grid; place-items: center; margin-bottom: var(--sd-s2); }
    .achievement-gallery-badge img { width: 104px; height: 104px; object-fit: contain; }
    .achievement-gallery-card.locked .achievement-gallery-badge img { filter: grayscale(1); opacity: .3; }
    .achievement-gallery-image-fallback {
      display: none; width: 80px; height: 80px; place-items: center; border-radius: 50%;
      color: var(--sd-text-2); background: var(--sd-surface-2);
      font-size: 17px; font-weight: 600;
    }
    .achievement-gallery-card.secret.locked .achievement-gallery-image-fallback {
      display: grid; color: var(--sd-text-3); font-size: 28px;
    }
    .achievement-gallery-status { color: var(--sd-text-3); font-size: 12px; font-weight: 500; }
    .achievement-gallery-card.unlocked .achievement-gallery-status { color: var(--sd-text-2); }
    .achievement-gallery-card h3 { margin: 4px 0; font-size: 17px; font-weight: 600; line-height: 1.25; }
    .achievement-gallery-description { margin: 0; color: var(--sd-text-2); font-size: 14px; line-height: 1.45; }
    .achievement-gallery-progress-row {
      display: flex; justify-content: space-between; gap: var(--sd-s1); margin-top: auto; padding-top: var(--sd-s2);
      color: var(--sd-text-2); font-size: 12px; font-weight: 500;
    }
    .achievement-gallery-progress {
      height: 3px; margin-top: 6px; overflow: hidden; border-radius: 2px;
      background: var(--sd-divider);
    }
    .achievement-gallery-progress span {
      display: block; height: 100%; border-radius: inherit; background: var(--sd-accent);
      transition: width var(--sd-base) var(--sd-ease);
    }
    .achievement-gallery-date { margin-top: var(--sd-s1); color: var(--sd-text-3); font-size: 12px; }
    .achievement-gallery-date:empty { display: none; }

    /* ── Flight log tab ────────────────────────────────────────── */
    .flight-log-scroll { padding: var(--sd-s2) var(--sd-pad) calc(96px + env(safe-area-inset-bottom)); }
    .flight-log-toolbar { display: flex; align-items: center; gap: var(--sd-s1); margin-bottom: var(--sd-s4); }
    .flight-log-year-filter {
      display: flex; gap: 4px; flex: 1 1 auto; min-width: 0;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent);
      mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent);
    }
    .flight-log-year-filter::-webkit-scrollbar { display: none; }
    .flight-log-year-chip {
      flex: 0 0 auto; min-height: 36px; padding: 0 var(--sd-s2); border: 0; border-radius: var(--sd-r-sm);
      background: transparent; color: var(--sd-text-2);
      font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer;
      transition: background var(--sd-fast) ease, color var(--sd-fast) ease;
    }
    .flight-log-year-chip.active { background: var(--sd-surface-2); color: var(--sd-text); }
    .flight-log-map-toggle {
      display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
      min-height: 36px; padding: 0 var(--sd-s2); border: 0; border-radius: var(--sd-r-sm);
      background: var(--sd-surface); color: var(--sd-text-2);
      font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; touch-action: manipulation;
      transition: background var(--sd-fast) ease, color var(--sd-fast) ease;
    }
    .flight-log-map-toggle.active { background: var(--sd-surface-2); color: var(--sd-accent); }
    .flight-log-icon-toggle { width: 36px; padding: 0; justify-content: center; }
    #flight-log-select-toggle.active { background: var(--sd-surface-2); color: var(--sd-accent); }

    .flight-log-stats {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sd-s2) var(--sd-s5);
      margin-bottom: var(--sd-s4); padding-bottom: var(--sd-s4); border-bottom: 1px solid var(--sd-divider);
    }
    .flight-log-stat-card { min-width: 0; }
    .flight-log-stat-card .num {
      font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -.02em;
      color: var(--sd-text); font-variant-numeric: tabular-nums;
    }
    .flight-log-stat-card:first-child .num { font-size: clamp(36px, 12vw, 48px); color: var(--sd-accent); }
    .flight-log-stat-card .label { margin-top: var(--sd-s1); color: var(--sd-text-2); font-size: 12px; font-weight: 500; }

    .flight-log-more-stats-toggle {
      display: flex; align-items: center; gap: 6px; width: 100%;
      margin: 0 0 var(--sd-s2); padding: var(--sd-s1) 0; border: 0; background: none;
      color: var(--sd-text-2); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .flight-log-more-stats-toggle .chevron { display: inline-flex; transition: transform var(--sd-base) var(--sd-ease); }
    .flight-log-more-stats-toggle.open .chevron { transform: rotate(180deg); }
    .flight-log-records {
      margin-bottom: var(--sd-s4); padding: 0 var(--sd-s3);
      background: var(--sd-surface); border-radius: var(--sd-r-md);
    }
    .flight-log-records.collapsed { display: none; }
    .flight-log-record-card {
      display: flex; align-items: baseline; gap: var(--sd-s1); min-width: 0;
      padding: var(--sd-s2) 0; border-top: 1px solid var(--sd-divider);
    }
    .flight-log-record-card:first-child { border-top: 0; }
    .flight-log-record-card .rlabel { flex: 1 1 auto; color: var(--sd-text-2); font-size: 14px; }
    .flight-log-record-card .rvalue { color: var(--sd-text); font-size: 14px; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
    .flight-log-record-card .rsub { flex: 0 0 auto; color: var(--sd-text-3); font-size: 12px; }

    .flight-log-section-label { margin: var(--sd-s5) 0 var(--sd-s1); color: var(--sd-text); font-size: 17px; font-weight: 600; }
    .flight-log-empty { text-align: center; color: var(--sd-text-3); font-size: 14px; line-height: 1.5; padding: var(--sd-s6) var(--sd-s3); }
    .flight-log-list { display: flex; flex-direction: column; }
    .flight-log-more-btn {
      width: 100%; margin-top: var(--sd-s1); padding: var(--sd-s2); border: 0; border-top: 1px solid var(--sd-divider);
      background: none; color: var(--sd-text-2); font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* ── Journey card (trip list) ─────────────────────────────── */
    .journey-section-label { margin: var(--sd-s4) 0 var(--sd-s2); color: var(--sd-text-2); font-size: 14px; font-weight: 600; }
    .journey-section-label:first-child { margin-top: 0; }
    .trip-entry { margin-bottom: var(--sd-s2); }
    .trip-row { position: relative; }
    .journey-card {
      position: relative; display: flex; flex-direction: column; min-height: 168px; overflow: hidden;
      padding: var(--sd-s4); border-radius: var(--sd-r-lg);
      background: var(--sd-surface); border: 1px solid var(--sd-divider);
      cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
      transition: transform 150ms var(--sd-ease), filter 150ms ease, border-color 150ms ease;
    }
    .journey-card:active { transform: scale(.98); }
    @media (hover: hover) { .journey-card:hover { filter: brightness(1.08); } }
    .journey-card__visual {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(60%, 300px); pointer-events: none;
      background-repeat: no-repeat; background-position: right bottom; background-size: cover;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 70%);
      mask-image: linear-gradient(to right, transparent 0%, #000 70%);
    }
    .journey-card__visual--photo {
      top: -4px; width: min(46%, 240px); opacity: .55; background-size: auto 100%;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 60%);
      mask-image: linear-gradient(to right, transparent 0%, #000 60%);
    }
    .journey-card__body {
      position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column;
      justify-content: space-between; gap: var(--sd-s4);
    }
    .journey-card__route {
      display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center;
      column-gap: var(--sd-s3); row-gap: 2px;
    }
    .jc-code { color: var(--sd-text); font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: .01em; }
    .jc-arrow { color: var(--sd-text-3); font-size: 20px; line-height: 1; }
    .jc-city { color: var(--sd-text-2); font-size: 15px; font-weight: 400; line-height: 1.5; }
    .journey-card__foot { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sd-s2); }
    .jc-date { color: var(--sd-text-2); font-size: 14px; font-weight: 400; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .jc-plane { flex: 0 0 auto; color: var(--sd-text-3); display: block; }
    #flight-log-list.select-mode .trip-row { padding-left: 36px; }
    .trip-entry.selected .journey-card { border-color: var(--sd-text-3); }

    .trip-details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--sd-base) var(--sd-ease); }
    .trip-entry.open .trip-details { grid-template-rows: 1fr; }
    .trip-details-clip { overflow: hidden; min-height: 0; }
    .trip-details-body { padding: var(--sd-s3) var(--sd-s1) var(--sd-s1); }
    .trip-meta { margin-bottom: var(--sd-s1); color: var(--sd-text-3); font-size: 12px; font-weight: 500; }
    .ticket-leg-row { display: flex; align-items: baseline; gap: var(--sd-s1); padding: 2px 0; color: var(--sd-text-2); font-size: 14px; }
    .ticket-leg-label { flex: 0 0 32px; color: var(--sd-text-3); }
    .ticket-leg-date { flex: 0 0 auto; color: var(--sd-text-2); font-variant-numeric: tabular-nums; }
    .ticket-leg-route { flex: 1; color: var(--sd-text); font-weight: 500; }
    .ticket-leg-km { color: var(--sd-text-2); font-size: 14px; }
    .ticket-leg-airline { margin: 0 0 4px 40px; color: var(--sd-text-3); font-size: 12px; }
    .trip-meta, .ticket-leg-airline, .ticket-note { overflow-wrap: anywhere; }
    .ticket-note { margin-top: var(--sd-s1); color: var(--sd-text-2); font-size: 14px; line-height: 1.4; }
    .trip-edit-btn {
      display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: var(--sd-s1); padding: 0;
      border: 0; background: none; color: var(--sd-text-2); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: color var(--sd-fast) ease;
    }
    .trip-edit-btn:hover { color: var(--sd-text); }
    .ticket-checkbox {
      position: absolute; top: 50%; left: 0; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%;
      border: 1.5px solid var(--sd-text-3); background: transparent; display: none; z-index: 6; cursor: pointer;
      transition: background var(--sd-fast) ease, border-color var(--sd-fast) ease;
    }
    .ticket-checkbox::before { content: ""; position: absolute; inset: -11px; }
    .ticket-checkbox::after {
      content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px;
      border: solid var(--sd-accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0;
    }
    #flight-log-list.select-mode .ticket-checkbox { display: block; }
    .trip-entry.selected .ticket-checkbox { background: var(--sd-accent); border-color: var(--sd-accent); }
    .trip-entry.selected .ticket-checkbox::after { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .journey-card, .trip-details { transition: none; }
    }

    .flight-log-merge-bar {
      display: none; position: absolute; left: var(--sd-pad); right: var(--sd-pad);
      bottom: calc(var(--sd-s2) + env(safe-area-inset-bottom));
      align-items: center; gap: var(--sd-s1);
      background: var(--sd-surface-2); border-radius: var(--sd-r-md);
      padding: var(--sd-s1) var(--sd-s1) var(--sd-s1) var(--sd-s3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4); z-index: 21;
    }
    .flight-log-merge-bar.show { display: flex; }
    .flight-log-merge-bar span { flex: 1; color: var(--sd-text-2); font-size: 14px; font-weight: 500; }
    .flight-log-merge-bar button { min-height: 40px; border: 0; border-radius: var(--sd-r-sm); padding: 0 var(--sd-s3); font-size: 14px; font-weight: 600; cursor: pointer; }
    .flight-log-merge-bar .merge-confirm { background: var(--sd-accent); color: var(--sd-accent-ink); }
    .flight-log-merge-bar .merge-cancel { background: none; color: var(--sd-text-2); padding: 0 var(--sd-s2); }
    .flight-log-fab {
      position: absolute; right: var(--sd-pad); bottom: calc(var(--sd-s3) + env(safe-area-inset-bottom));
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--sd-accent); color: var(--sd-accent-ink); border: 0;
      font-size: 28px; font-weight: 400; line-height: 1; cursor: pointer; display: grid; place-items: center;
      transition: transform var(--sd-fast) var(--sd-ease);
    }
    .flight-log-fab:active, .flight-log-sheet-submit:active, .merge-confirm:active { transform: scale(.97); }

    /* ── Add / edit flight sheets ──────────────────────────────── */
    .flight-log-sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: flex-end; justify-content: center; z-index: 2200; }
    .flight-log-sheet-backdrop.show { display: flex; animation: sd-fade var(--sd-base) ease-out; }
    .flight-log-sheet-backdrop.show .flight-log-sheet { animation: sd-rise var(--sd-base) var(--sd-ease); }
    .flight-log-sheet {
      width: 100%; max-width: 560px; max-height: calc(var(--app-height, 100vh) * 0.92); overflow-y: auto;
      overscroll-behavior: contain; color: var(--sd-text); color-scheme: dark;
      background: var(--sd-surface); border-radius: var(--sd-r-lg) var(--sd-r-lg) 0 0;
      padding: 0 var(--sd-pad) calc(var(--sd-s4) + env(safe-area-inset-bottom));
    }
    .flight-log-sheet-header {
      position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--sd-s2);
      padding: var(--sd-s4) 0 var(--sd-s2);
    }
    .flight-log-sheet-header::before {
      content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 5px; border-radius: 3px; background: var(--sd-text-3); opacity: .6;
    }
    .flight-log-sheet h3 { margin: 0; font-size: 17px; font-weight: 600; }
    .flight-log-sheet-close {
      position: relative; width: 32px; height: 32px; flex: 0 0 auto; border: 0; border-radius: 50%;
      display: grid; place-items: center;
      color: var(--sd-text-2); background: var(--sd-surface-2);
      cursor: pointer; touch-action: manipulation;
    }
    .flight-log-sheet-close::before { content: ""; position: absolute; inset: -6px; }
    .flight-log-field-row { display: flex; gap: var(--sd-s2); margin-bottom: var(--sd-s2); }
    .flight-log-field { flex: 1; min-width: 0; margin-bottom: var(--sd-s2); }
    .flight-log-field-row .flight-log-field { margin-bottom: 0; }
    .flight-log-field label { display: block; margin-bottom: 6px; color: var(--sd-text-2); font-size: 12px; font-weight: 500; }
    .flight-log-field input,
    .flight-log-field select,
    .flight-log-field textarea {
      width: 100%; padding: var(--sd-s2); border: 0; border-radius: var(--sd-r-sm);
      background: var(--sd-surface-2); color: var(--sd-text); font-size: 16px; font-family: inherit;
    }
    .flight-log-field input::placeholder, .flight-log-field textarea::placeholder { color: var(--sd-text-3); }
    .flight-log-field input:disabled { opacity: .5; cursor: not-allowed; }
    .flight-log-field textarea { resize: vertical; min-height: 44px; }
    .date-select-group { display: flex; gap: var(--sd-s1); }
    .date-select-group select { flex: 1; min-width: 0; padding: var(--sd-s2) var(--sd-s1); text-align: center; }
    .date-field-row { flex-direction: column; }
    .flight-log-swap-btn {
      width: 44px; height: 44px; margin-top: 22px; border: 0; border-radius: var(--sd-r-sm);
      background: var(--sd-surface-2); color: var(--sd-text-2); cursor: pointer;
      display: grid; place-items: center; flex: 0 0 auto;
    }
    .flight-log-swap-btn:hover { color: var(--sd-text); }
    .flight-log-sheet-submit {
      width: 100%; margin-top: var(--sd-s1); padding: 14px; border: 0; border-radius: var(--sd-r-sm);
      background: var(--sd-accent); color: var(--sd-accent-ink); font-size: 16px; font-weight: 600; cursor: pointer;
      transition: transform var(--sd-fast) var(--sd-ease);
    }
    .flight-log-sheet-delete {
      width: 100%; margin-top: var(--sd-s1); padding: var(--sd-s2); border: 0; background: none;
      color: var(--sd-danger); font-size: 16px; cursor: pointer; text-align: center;
    }
    .flight-log-sheet-msg { min-height: 20px; margin-top: var(--sd-s1); font-size: 14px; text-align: center; }
    .flight-log-oneway-toggle {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sd-s2);
      background: var(--sd-surface-2); border-radius: var(--sd-r-sm); padding: var(--sd-s2) var(--sd-s3); margin-bottom: var(--sd-s2);
    }
    .flight-log-oneway-toggle span { color: var(--sd-text); font-size: 16px; }
    .flight-log-oneway-switch {
      position: relative; width: 51px; height: 31px; border-radius: 16px; border: 0;
      background: var(--sd-text-3); cursor: pointer; flex: 0 0 auto; padding: 0;
      transition: background var(--sd-base) var(--sd-ease);
    }
    .flight-log-oneway-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
      border-radius: 50%; background: #fff; transition: transform var(--sd-base) var(--sd-ease);
    }
    .flight-log-oneway-switch.on { background: var(--sd-accent); }
    .flight-log-oneway-switch.on::after { transform: translateX(20px); }

    /* ── Mobile: gallery becomes a bottom sheet ───────────────── */
    @media (max-width: 860px), (pointer: coarse) {
      #achievement-gallery-overlay { padding: 0; align-items: flex-end; }
      .achievement-gallery-panel { width: 100%; max-height: calc(var(--app-height, 100vh) * 0.92); border-radius: var(--sd-r-lg) var(--sd-r-lg) 0 0; }
      .achievement-gallery-header { padding-top: 26px; }
      .achievement-gallery-header::before {
        content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
        width: 36px; height: 5px; border-radius: 3px; background: var(--sd-text-3); opacity: .6;
      }
      #achievement-gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .achievement-gallery-card { padding: var(--sd-s2); }
      .achievement-gallery-badge { height: 94px; }
      .achievement-gallery-badge img { width: 92px; height: 92px; }
    }
    @media (max-width: 420px) {
      #achievement-gallery-grid { grid-template-columns: 1fr; }
      .achievement-gallery-card { display: grid; grid-template-columns: 94px 1fr; column-gap: var(--sd-s2); }
      .achievement-gallery-badge { grid-row: 1 / span 6; height: 100px; margin: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #achievement-gallery-overlay.show, #achievement-gallery-overlay.show .achievement-gallery-panel,
      .gallery-tab-panel.active, .flight-log-sheet-backdrop.show, .flight-log-sheet-backdrop.show .flight-log-sheet { animation: none; }
      #achievement-toast, .achievement-gallery-progress span { transition: none; }
    }

  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="route-popup-layer" aria-live="polite"></div>

  <!-- Header -->
  <div id="header">
    <div id="header-left">
      <div id="cockpit-brand" data-i18n-aria="brandAria" aria-label="航線圖鑑 SkyDex">
        <span class="cockpit-brand-kicker">SkyDex</span>
        <span class="cockpit-brand-title" data-i18n="brandTitle">航線圖鑑</span>
      </div>
      <!-- 統一用膠囊按鈕＋展開選單取代原本橫排 tabs，避免航空公司變多時橫向擠壓/溢出 -->
      <div id="airline-picker">
        <button id="airline-chip" type="button" onclick="toggleAirlinePicker()" aria-haspopup="listbox" aria-expanded="false">
          <span class="airline-chip-dot" id="airline-chip-dot"></span>
          <span class="airline-chip-label" id="airline-chip-label"></span>
          <svg class="airline-chip-chevron" id="airline-chip-chevron" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="airline-picker-panel" role="listbox" aria-hidden="true"></div>
      </div>
    </div>
    <div id="header-right">
      <button class="lang-toggle-btn" id="lang-toggle-btn" type="button" title="Switch language / 切換語言" aria-label="Switch language" onclick="setLang(LANG === 'en' ? 'zh' : 'en')">EN</button>
      <button class="achievement-gallery-button" id="achievement-gallery-button" type="button"
        onclick="handleAchievementButtonClick()" aria-haspopup="dialog" aria-controls="achievement-gallery-overlay" aria-expanded="false">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M5 2h6v3.2c0 2-1.34 3.66-3 3.66S5 7.2 5 5.2V2Z" stroke="currentColor" stroke-width="1.2"/>
          <path d="M5 3.2H2.8c0 2.3.9 3.65 2.85 4.1M11 3.2h2.2c0 2.3-.9 3.65-2.85 4.1M8 8.9v2.25M5.5 14h5M6.1 11.15h3.8V14H6.1v-2.85Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="achievement-gallery-button-label" id="achievement-gallery-button-label" data-i18n="achievementsBtn">成就</span>
        <span id="achievement-gallery-button-count">0/9</span>
        <span id="auth-status-dot" aria-hidden="true"></span>
      </button>
      <button class="fb-fab" id="fb-fab" data-i18n-title="feedbackBtn" data-i18n-aria="feedbackBtn" title="問題回報 / 建議" aria-label="問題回報 / 建議" onclick="fbOpen()">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 1.5C4.41 1.5 1.5 4.08 1.5 7.25c0 1.52.65 2.9 1.7 3.9L2.5 14l2.97-1.1C6.35 13.28 7.16 13.5 8 13.5c3.59 0 6.5-2.58 6.5-5.75S11.59 1.5 8 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="5.5" cy="7.5" r="0.7" fill="currentColor"/>
          <circle cx="8" cy="7.5" r="0.7" fill="currentColor"/>
          <circle cx="10.5" cy="7.5" r="0.7" fill="currentColor"/>
        </svg>
        <span class="fb-fab-label" data-i18n="feedbackBtn">問題回報 / 建議</span>
      </button>
    </div>
  </div>

  <!-- Search -->
  <div id="search-wrap">
    <div id="search-inner">
      <svg id="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="5.5" cy="5.5" r="4" stroke="#86868b" stroke-width="1.3"/>
        <path d="M9 9L12.5 12.5" stroke="#86868b" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input id="search-input" type="text" placeholder="搜尋所有航空公司航點或 IATA" data-i18n-placeholder="searchPlaceholder" oninput="onSearch(this.value)" />
    </div>
    <div id="search-results"></div>
    <div id="filter-bar" data-i18n-aria="filterSummaryAria" aria-label="航線篩選摘要">
      <button id="filter-trigger" type="button" onclick="toggleFilterPanel()" aria-haspopup="dialog" aria-controls="filter-panel" aria-expanded="false">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4h11M4.5 8h7M6.5 12h3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          <circle cx="5" cy="4" r="1.15" fill="currentColor"/><circle cx="10.5" cy="8" r="1.15" fill="currentColor"/><circle cx="8" cy="12" r="1.15" fill="currentColor"/>
        </svg>
        <span data-i18n="filterBtn">篩選</span>
        <span id="filter-count-badge" hidden>0</span>
      </button>
    </div>
  </div>

  <div id="filter-backdrop" aria-hidden="true" onclick="closeFilterPanel()"></div>
  <section id="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-panel-title" aria-hidden="true">
    <div class="filter-sheet-handle" aria-hidden="true"></div>
    <div class="filter-panel-header">
      <div class="filter-title-wrap">
        <div class="filter-eyebrow">Route filters</div>
        <div class="filter-title">
          <span id="filter-panel-title" data-i18n="filterPanelTitle">篩選航線</span>
          <span class="filter-title-dest"><span class="stat-value" id="stat-dest">35</span><span data-i18n="destinationsUnit">目的地</span></span>
        </div>

function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0]-a[0])*r, dLon = (b[1]-a[1])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}
const LEFT_SIDE_AIRPORTS = new Set(["ACC", "MAD", "LHR", "LGW", "DUB", "LIS", "AGP", "MAN", "CMN"]);

function bezierArc(s, e, preferLeftSide = false) {
  let eLng = e[1];
  if (!preferLeftSide && s[1] > 0 && e[1] < 0) eLng = e[1] + 360;
  // 扁平版：弧線高度依兩點距離縮放，短程航線弧度輕微，長程航線設上限避免過度隆起。
  const dist = Math.hypot(e[0] - s[0], eLng - s[1]);
  const arcHeight = Math.min(Math.max(dist * 0.12, 1.2), 6);
  const mLat = (s[0]+e[0])/2 + arcHeight, mLng = (s[1]+eLng)/2;
  const pts = [];
  const STEPS = 50;
  for (let i = 0; i <= STEPS; i += 1) {
    const t = i / STEPS;
    pts.push([(1-t)**2*s[0]+2*(1-t)*t*mLat+t**2*e[0], (1-t)**2*s[1]+2*(1-t)*t*mLng+t**2*eLng]);
  }
  return pts;
}

}
function mapRouteCoord(d, id) {

  // 土耳其航空以每條航線的出發地為基準，選擇距離最近的世界地圖副本。

    overheadMinutes = 30;

function routePatternMetrics(d, id, pattern) {
  const meta = AIRLINE_META_INFO[id] || {};
  const originCoord = HUB_COORDS[d.origin] || AIRPORT_MASTER[d.origin]?.coords || meta.hubCoords || HUB_COORDS.TPE;
  const stopCoords = (pattern.stops || [])
    .map(iata => AIRPORT_MASTER[iata]?.coords)
    .filter(Boolean);
  const points = [originCoord, ...stopCoords, d.coords];
  let distanceKm = 0;
  let totalMinutes = 0;
  for (let i = 1; i < points.length; i += 1) {

function routeRows(d, id) {
  const meta = AIRLINE_META_INFO[id] || {};
  const hubCoord = HUB_COORDS[d.origin] || AIRPORT_MASTER[d.origin]?.coords || meta.hubCoords || HUB_COORDS.TPE;
  const hubLabel = hubLabelText(d.origin) || meta.hub || d.origin || "TPE";
  const patterns = routeServicePatterns(d);
  const hasStopPattern = patterns.some(pattern => (pattern.stops || []).length > 0 || pattern.nonstop === false);
  const isMixedService = patterns.length > 1;
  const primaryMetrics = routePatternMetrics(d, id, patterns[0]);
  const rows = [
    [t("region"),   filterRegionLabel(d.region)],
    [`${t("distFrom")} ${hubLabel}`, primaryMetrics.distanceKm.toLocaleString() + " km"],
    [t("estFlightTime"), formatFlightMinutes(primaryMetrics.totalMinutes)],
    [t("coordinates"),   fmtCoord(d.coords)],
  ];

  if (hasStopPattern) {
    if (isMixedService) {
      rows.splice(1, 2, [t("routeType"), t("mixedType")]);
      patterns.forEach(pattern => {
        const flights = (pattern.flightNumbers || []).join(listSep()) || t("flightNo");
        const stops = pattern.stops || [];
        const metrics = routePatternMetrics(d, id, pattern);
        const routeType = stops.length
          ? `${t("viaPrefix")} ${stops.map(airportRouteLabel).join(listSep())}`
          : t("nonstop");
        const availability = pattern.status === "SCHEDULED"
          ? ` · ${pattern.effectiveDate ? `${pattern.effectiveDate} ${t("effectiveFromSuffix")}` : t("comingSoon")}`
          : pattern.status === "SEASONAL" ? ` ${t("seasonalSuffix")}` : "";
        rows.splice(rows.length - 1, 0, [flights, `${routeType}${availability} · ${metrics.distanceKm.toLocaleString()} km · ${formatFlightMinutes(metrics.totalMinutes)}`]);
      });
    } else {
      const stops = patterns[0].stops || [];
      const itinerary = [d.origin, ...stops, d.iata].map(airportRouteLabel).join(" → ");
      rows.splice(1, 0, [t("routeType"), t("stopsCount").replace("{n}", stops.length)], [t("itinerary"), itinerary]);
      if ((patterns[0].flightNumbers || []).length) {
        rows.splice(3, 0, [t("flightNo"), patterns[0].flightNumbers.join(listSep())]);
      }
    }
  }

  if (d.origin && d.origin !== (meta.hub || "TPE")) rows.push([t("departureHub"), hubLabelText(d.origin)]);
  if (d.status === "SUSPENDED") rows.unshift([t("statusLabel"), t("suspendedStatus")]);
  else if (d.status === "SEASONAL") rows.unshift([t("statusLabel"), t("seasonalStatus")]);
  else if (d.status === "SCHEDULED") {
    rows.unshift(
      [t("statusLabel"), t("scheduledStatus")],
      [t("effectiveDate"), d.effectiveDate || t("tbd")]
    );
  }

  if (!hasStopPattern) {
    const flightNos = patterns[0].flightNumbers || [];
    rows.push([t("flightNo"), flightNos.length ? flightNos.join(listSep()) : "NIL"]);
  }
  const freqUnit = d.frequencyType === "weekly" ? t("weekUnit") : (d.frequencyType || "");
  rows.push(
    [t("weeklyFreq"), d.frequency != null ? `${d.frequency} ${t("perWeekSuffix")}${freqUnit || t("weekUnit")}` : "NIL"],
    [t("airportFullName"), d.airportName || "NIL"],
    [t("country"),     d.country || "NIL"],
    [t("alliance"), meta.alliance || "NIL"],
  );
  return rows;
}

function syncRoutePopupPosition() {
  if (!activeRoutePopup?.element || !map) return;
  const mapRect = map.getContainer().getBoundingClientRect();
  const point = map.latLngToContainerPoint(activeRoutePopup.latlng);
  const anchorX = mapRect.left + point.x;
  const anchorY = mapRect.top + point.y;
  const popup = activeRoutePopup.element;
  const popupRect = popup.getBoundingClientRect();
  const gap = isTouchDevice ? 18 : 14;
  const edge = 8;
  const left = Math.min(
    Math.max(anchorX - popupRect.width / 2, edge),
    Math.max(edge, window.innerWidth - popupRect.width - edge),
  );
  const top = Math.min(
    Math.max(anchorY - popupRect.height - gap, edge),
    Math.max(edge, window.innerHeight - popupRect.height - edge),
  );
  popup.style.left = `${left}px`;
  popup.style.top = `${top}px`;
  popup.style.setProperty(
    "--route-popup-tip-left",
    `${Math.min(Math.max(anchorX - left, 22), Math.max(22, popupRect.width - 22))}px`,
  );
}

function routePatternMapPoints(d, id, pattern) {
  const meta = AIRLINE_META_INFO[id] || {};
  const originCoord = HUB_COORDS[d.origin] || AIRPORT_MASTER[d.origin]?.coords || meta.hubCoords || HUB_COORDS.TPE;
  const stops = (pattern.stops || []).map(iata => ({
    iata,
    coords: AIRPORT_MASTER[iata]?.coords,
  })).filter(stop => stop.coords);
  const rawPoints = [
    { iata: d.origin || "", coords: originCoord },
    ...stops,
    { iata: d.iata, coords: d.coords },
  ];

  return rawPoints.map((point, index) => {
    if (index === 0) return mapCoord(point.coords, point.iata);
    if (id === "TK") {
      const previous = rawPoints[index - 1];
      return mapRouteCoord({ ...d, iata: point.iata, coords: point.coords, origin: previous.iata }, id);
    }
    return mapCoord(point.coords, point.iata);
  });
}
function routePatternArc(d, id, pattern) {
  const points = routePatternMapPoints(d, id, pattern);
  const stopIatas = pattern.stops || [];
  const arc = [];
  for (let i = 1; i < points.length; i += 1) {
    const destinationIata = i <= stopIatas.length ? stopIatas[i - 1] : d.iata;
    const segment = bezierArc(
      points[i - 1],
      points[i],
      id === "TK" || LEFT_SIDE_AIRPORTS.has(destinationIata),
    );
    arc.push(...(arc.length ? segment.slice(1) : segment));
  }
  return arc;
}
function openRoutePopup(d, id, showPopup = true) {
  closeRoutePopup();
  const meta = AIRLINE_META_INFO[id] || {};
  const viewCoord = mapRouteCoord(d, id);
  const patterns = routeServicePatterns(d);
  const routeLayers = [];
  const routeLines = patterns.map((pattern, index) => {
    // 線型只表達是否已開航：現役直飛與中停航段皆為實線，尚未開航為虛線。
    // servicePatterns 可個別覆寫狀態；未覆寫時沿用整條航線的狀態。
    const patternStatus = pattern.status || d.status || "ACTIVE";
    const isScheduled = patternStatus === "SCHEDULED";
    const line = L.polyline(routePatternArc(d, id, pattern), {
      color: meta.color || "#000",
      weight: index === 0 ? 2 : 1.8,
      opacity: index === 0 ? 0.68 : 0.58,
      dashArray: isScheduled ? "7 7" : null,
      interactive: false,
    });
    routeLayers.push(line);
    return line;
  });

  const stopIatas = [...new Set(patterns.flatMap(pattern => pattern.stops || []))];
  stopIatas.forEach(iata => {
    const airport = AIRPORT_MASTER[iata];
    if (!airport) return;
    const stopCoord = id === "TK"
      ? mapRouteCoord({ ...d, iata, coords: airport.coords }, id)
      : mapCoord(airport.coords, iata);
    routeLayers.push(L.marker(stopCoord, {
      icon: L.divIcon({
        className: "route-stop-marker-wrap",
        html: `<span class="route-stop-marker">${iata}</span>`,
        iconSize: [1, 1],
        iconAnchor: [0, 0],
      }),
      interactive: false,
      keyboard: false,
    }));
  });

  activeLine = L.layerGroup(routeLayers).addTo(map);
  animateRouteDraw(routeLines[0], d, id);
  if (showPopup) {
    activeRoutePopup = openRouteOverlayPopup(routePopupHtml(d, id), viewCoord);
  }
}

function routeStatusKey(d) {

function filterRegionLabel(region) {

function routeMatchesFilters(d) {
  const originMatch = routeFilters.origins.size === 0 || routeFilters.origins.has(d.origin || "UNKNOWN");
  const regionMatch = routeFilters.regions.size === 0 || routeFilters.regions.has(d.region || "UNKNOWN");
  const statusMatch = routeFilters.statuses.size === 0 || routeFilters.statuses.has(routeStatusKey(d));

  let count = 0;
  if (routeFilters.origins.size > 0) count++;
  if (routeFilters.regions.size > 0) count++;
  const defaultStatus = routeFilters.statuses.size === DEFAULT_ROUTE_STATUSES.size &&
    [...DEFAULT_ROUTE_STATUSES].every(v => routeFilters.statuses.has(v));
  if (!defaultStatus) count++;

function optionCounts(routes, accessor) {
  const counts = new Map();

function toggleRouteFilter(group, value) {
  const set = routeFilters[group];
  if (!(set instanceof Set)) return;
  if (value === "__ALL__") {
    set.clear();
  } else if (set.size === 0) {
    set.add(value);
  } else if (set.has(value)) {
    set.delete(value);
  } else {
    set.add(value);
  }
  applyRouteFilters();
}
